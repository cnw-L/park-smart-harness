name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
      - name: Test
        run: python -m pytest tests/ -q
      - name: Lint
        run: python -m ruff check src/ tests/

# ruff 曾长期"配而不跑"（存量经治理于 2026-09 清零，配置侧豁免项及理由见 pyproject
# [tool.ruff.lint] ignore 注释）；此步骤为常驻回归门禁，二期治理项另立 issue。
