# SP-19 Calibration / Current Update / Change Closure — Operation Contract
# Machine-loadable mirror of 第五篇-SP19-CalibrationCurrentUpdateChangeClosure-正式操作规程.md
# The Markdown body is the normative source; this contract is its structured projection
# for harness execution (park-smart-harness). Semantics must not diverge: if they do,
# repair the projection, never the reverse (GI-13).
apiVersion: spec.part5/v1alpha1
kind: OperationContract
metadata:
  id: SP-19
  name: Calibration / Current Update / Change Closure
  status: sealed                   # 2026-08-31 group-3 audit PASS AFTER REPAIR + regression 1050 citations VERIFIED (2 note-level repairs)
  version: 1.0.0
  normativeSource: 第五篇-SP19-CalibrationCurrentUpdateChangeClosure-正式操作规程.md
  singleResponsibility: >
    Calibrate a change's actual results into truthful Current: disposition every
    material Actual-vs-Accepted delta, commit each applicable Current Transition
    Obligation to its real authority (or confirm unchanged / controlled transition /
    transfer / no-longer-applicable), prove Scoped Current Update Completeness, and
    issue the Closure Decision while the Closure Basis is still applicable.
    SP-19 is the sole calibration/closure procedure and the executor of most Current
    commits; release/runtime transitions committed earlier under Ch7 authority are
    verified here, never re-faked.

spec:

  triggers:
    - id: T-change-path-complete-needs-closure
    - id: T-ch8-special-lifecycle-prerequisites-done   # fence/transfer/emergency reconciled
    - id: T-standalone-calibration                     # drift / structure health finding, via explicit change (GI-03)
    - id: T-closure-revalidation-material-change       # reconcile and re-enter
  redLine: >
    No Closure Obligation Set may be formed without the final Closure Accountability
    Scope reconciliation (P4 Ch9 §32). Initial Scope != Closure Accountability Scope.

  inputs:
    required:
      - name: change_record
        type: ref
        rule: OPEN, with full history (starting/working baseline, impact, design,
              candidate, release, Ch8 residual/transfer as applicable)
      - name: final_accepted_responsibility
        type: reference-set                 # requirement / design / decision revisions
      - name: actual_result_set
        type: list<evidence-ref>            # P4 Ch9 §13; never "developer says done"
      - name: earlier_current_transition_facts
        type: list<commit-fact-ref>
        rule: keep real occurrence time; never re-fake as "just updated"   # §34-36
    conditional:
      - name: ch8_prerequisite_evidence
        type: reference-set
        appliesWhen: cancelled-or-superseded-or-emergency-or-partial-path

  outputs:
    primary:
      - name: calibration_record
        fields: [subject, baseline-kind, baseline-scope, delta-class, disposition, evidence-ref]
      - name: current_transition_commit_facts
        type: list<commit-fact>             # authority-resolvable resulting revision/state
      - name: transition_ledger_entries
        rule: reference authority-backed facts; never manufacture them   # §41/§48
      - name: scoped_current_update_completeness
        type: progress-fact
      - name: closure_basis
        type: reference-set                 # references, not copies   # §65
      - name: closure_decision
        fields: [record-state, terminal-disposition, reason, authority, basis-ref]
    nonOutputs:
      - candidate-acceptance-or-verification-verdict   # Ch6 / SP-13
      - release-or-target-validation-execution         # Ch7 / SP-15 / SP-17
      - fence-transfer-emergency-reconciliation        # Ch8; SP-21 pending (group-5)
      - what-redefinitions                             # requirement/contract/data content

  invariants:
    - id: closure-not-first-current-update
    - id: actual-reality-not-current-authority
    - id: ledger-not-authority-commit
    - id: completeness-not-global-same-version
    - id: truthful-current-not-zero-finding
    - id: truthful-transition-not-zero-responsibility
    - id: candidate-rejected-not-change-rejected
    - id: release-completion-not-change-closure
    - id: closure-basis-can-go-stale
    - id: closed-history-never-rewritten

  actions:
    - id: A1
      name: Confirm closure entry prerequisites; form Closure Accountability Scope
      controlMode: automation-assisted   # candidate diffs listed; conclusion is human
      formula: >
        final accepted responsibility + material actual reality caused/owned +
        applicable current transition obligations + transition/exception/cleanup/
        residual responsibility - validly transferred - authoritatively no-longer-applicable
      rules:
        - ch8 prerequisites verified when applicable; missing -> return Ch8 path,
          never mask with a closure checklist        # §3/§77/§107
        - history (starting scope / initial impact / old design scope) preserved  # §29
        - "reconciliation barrier sweeps: data, config, migration, external side
effect, feature flag, runtime mapping, partial delivery, cleanup" # §32/§54
    - id: A2
      name: Form Applicable Current Transition Obligation Set
      controlMode: engineering-decision
      sources: [accepted-requirement-decision, impact-obligation, accepted-design-target-transition,
                actual-implementation-candidate, release-runtime-recovery-result,
                calibration-material-delta, ch8-residual-transfer, late-material-fact]
      endStates: [current-committed, unchanged-confirmed, controlled-state-explicit,
                  transferred, no-longer-applicable-by-authority]
      neverCountAsDone: [todo-later, docs-pending, someone-knows,
                         ticket-linked-but-successor-not-accepted,
                         ledger-says-updated-but-authority-old,
                         exception-without-owner-or-exit]
      rule: earlier committed transitions are confirmed, not re-faked   # §34-36
        # unchanged-confirmed is a legitimate outcome (§38); a small change never
        # mechanically records every unaffected baseline
    - id: A3
      name: Establish Calibration Subject Set
      controlMode: automation
      subjectMinimum: [change-id, baseline-kind, baseline-scope, subject-concern,
                       accepted-basis-ref, actual-evidence-ref, authority-ref]
      rule: calibration is never a global boolean; re-check upstream gate-zeroing
            dispositions for resolvable rationale/evidence, challenge disguised ones
            back to their source procedure
    - id: A4
      name: Execute controlled Actual-vs-Accepted comparison
      controlMode: automation-assisted
      rule: insufficient evidence -> evidence-gap / not-ready; never assume-aligned  # §25
    - id: A5
      name: Classify delta; issue Calibration Disposition
      controlMode: engineering-decision
      vocabulary: [aligned, permitted-variance, controlled-transition, valid-exception,
                   fix-reality-rework, update-accepted-authority,
                   evidence-gap-not-ready, context-reconciliation-required]
      materialDeltaSignals: [requirement-behavior, module-responsibility, public-contract,
                             data-meaning-authority, security-trust-boundary,
                             long-lived-structure, runtime-deployment-boundary,
                             migration-compatibility, recovery-direction,
                             verification-obligation, supported-release-reality]
      rules:
        - material delta must not be masked as implementation detail   # §17
        - "fix-reality returns by cause: new-impact->SP-04, invalid-target-design->SP-05,
          implementation-defect->SP-06, candidate-evidence->SP-13, delivery-runtime->SP-15/17,
special-lifecycle-residual->Ch8" # §23
        - update-accepted-authority must pass the concern's real authority decision plus
          applicable impact/verification before any current update; no actual->current shortcut  # §24
    - id: A6
      name: Authority-backed Current Commit (Commit Guard + Commit Barrier)
      controlMode: automation   # guard checks automated; decision to proceed stays governed
      commitGuardChecks: [expected-current-revision-still-current, authority-source-same,
                          baseline-scope-same, requirement-design-decision-applicable,
                          concurrent-material-delta, transition-exception-basis-changed]
      concurrency:
        noMaterialEffect: record and proceed; no full redo required   # §44
        materialEffect: stop stale update; context reconciliation; return per layer  # §45
        technique: optimistic-concurrency-agnostic (expected-revision / CAS / etag / generation / manual)
      authorityConfirmation: [baseline-kind, baseline-scope, previous-authority-revision,
                              resulting-authority-revision-state, effective-accepted-at,
                              decision-evidence, trigger-change, transition-exception-ref]
      rule: failed/unknown/conflicted -> not-committed -> no closure   # §48
    - id: A7
      name: Record Current Baseline Transition Ledger
      controlMode: automation
      fields: [from, to-or-unchanged, scope, authority, decision-evidence,
               effective-time, trigger-change, transition-exception]
      rule: ledger is navigable/auditable record, not ultimate authority   # §41/§60
    - id: A8
      name: Truthful Current and cross-baseline coherence check
      controlMode: guardrail + engineering-decision
      rules:
        - unexplained material actual-vs-expressed conflict blocks completeness   # §49
        - health-affected current is legal but navigation must show finding,
          owner, disposition, successor/exit     # §50
        - same-scope currents materially coherent or explicitly explained   # §61
        - cross-scope differences legal when scope and responsibility are clear   # §62
    - id: A9
      name: Judge Scoped Current Update Completeness
      controlMode: guardrail + engineering-decision
      dimensions: [scope-completeness, authority-completeness, reality-evidence-completeness,
                   transition-exception-residual-responsibility-completeness,
                   ledger-trace-completeness]
      transitionResponsibilityBarrier: >
        An active transition is a truthful current fact, but while its exit/expiry/
        cleanup responsibility remains with this change, the change stays OPEN;
        only completed exit or traceably accepted successor/maintenance ownership
        unblocks closure.   # §58-59
    - id: A10
      name: Form Closure Obligation Set and Closure Basis
      controlMode: engineering-decision
      rules:
        - closure basis references evidence sets; it does not copy all logs   # §65
        - "findings/debt need not be zero, but each is judged: violates accepted
          obligation? still owned by this change? affects current truth?
gate-relevant? has independent accepted follow-up?" # §80-81
        - unmet requirement/contract/data/security/transition obligations must not
          be renamed technical debt to bypass closure   # §79
    - id: A11
      name: Closure Revalidation and Closure Decision
      controlMode: guardrail + engineering-decision   # readiness auto-verified; decision is authority's
      readinessMinimum: [closure-accountability-scope-complete,
                         calibration-material-subjects-dispositioned,
                         scoped-current-update-completeness-satisfied,
                         no-unresolved-blocking-evidence-gap,
                         no-active-obligation-retained,
                         ch8-prerequisites-satisfied-when-applicable,
                         closure-basis-still-applicable]
      revalidation: >
        Before OPEN->CLOSED, reconfirm the material basis still applies;
        unrelated concurrent change -> no material effect -> may close without full
        retest; material change -> reconcile and re-decide.   # §67-69
      terminalDispositions: [completed, rejected, cancelled, superseded]   # Ch1 only; no new states
      rules:
        - completed != zero-bug / zero-debt / no-future-change   # §72
        - candidate reject is a Ch6 candidate fact, never auto change-rejected   # §73
        - terminal rejected with persistent side effects requires reconciliation first  # §76
        - cancelled/superseded keep Ch8 prerequisites; SP-19 never redoes fence/transfer  # §77
    - id: A12
      name: Post-closure obligations
      controlMode: engineering-decision
      rules:
        - closure is a point-in-time decision; later current changes do not falsify it  # §82
        - post-closure discoveries produce new finding/incident/change referencing
          the closure; history is never silently rewritten   # §83

  gates:
    - id: G-SP19-01
      type: hard-gate
      rule: no-closure-scope-limited-to-initial-intent
    - id: G-SP19-02
      type: hard-gate
      rule: observed-reality-never-auto-becomes-current-authority
    - id: G-SP19-03
      type: hard-gate
      rule: no-current-commit-without-commit-guard
    - id: G-SP19-04
      type: hard-gate
      rule: failed-unknown-conflicted-authority-write-is-not-committed
    - id: G-SP19-05
      type: hard-gate
      rule: no-completeness-with-unexplained-material-cross-baseline-conflict
    - id: G-SP19-06
      type: hard-gate
      rule: no-closure-while-transition-exit-responsibility-retained
    - id: G-SP19-07
      type: hard-gate
      rule: no-unmet-obligation-renamed-as-technical-debt
    - id: G-SP19-08
      type: hard-gate
      rule: gate-zeroing-disposition-requires-resolvable-rationale-evidence
      note: covers permitted-variance / unchanged-confirmed / no-longer-applicable /
            transferred / no-material-effect judgments   # B1 systemic rule
    - id: G-SP19-09
      type: hard-gate
      rule: no-open-to-closed-without-closure-revalidation
    - id: G-SP19-10
      type: hard-gate
      rule: candidate-reject-never-auto-change-terminal-rejected
    - id: G-SP19-11
      type: hard-gate
      rule: no-ch8-prerequisite-bypass
    - id: G-SP19-12
      type: hard-gate
      rule: closure-and-current-transition-history-never-rewritten

  passExit:
    calibrationOnly:
      equals: scoped-current-update-completeness fact for the invoked scope,
              ledger resolvable to real commit facts
    changeClosure:
      equals: completeness satisfied AND closure readiness (7 conditions) met AND
              revalidation passed AND closure decision recorded
              (record-state CLOSED + terminal disposition + basis ref)
    doesNotMean: [system-zero-bug-or-debt, all-baselines-globally-same-version,
                  candidate-accepted, future-evolution-frozen, history-rewritable]

  returnPaths:
    - condition: ch8 prerequisite missing
      next: ch8 path; SP-21 / SP-20 pending-definition (group-5); until then follow Ch8 body
    - condition: fix-reality by cause
      next: [SP-04 new impact, SP-05 invalid target/design, SP-06 implementation defect,
             SP-13 candidate/evidence, SP-15 / SP-17 delivery/runtime]
    - condition: evidence gap / not ready
      next: complete evidence / reconciliation; never assume-aligned
    - condition: stale current (material concurrent change)
      next: context reconciliation; update calibration basis; new revision or confirm current
    - condition: transition exit responsibility unresolved
      next: complete exit, or transfer to traceably accepting successor/maintenance owner;
            current navigation must show active transition + new owner
    - condition: closure basis stale at revalidation
      next: reconcile and re-decide

  exceptions:
    - id: E-small-change
      rule: fold calibration / current-update / residual / closure into one issue;
            semantics not skippable   # §99
    - id: E-calibration-only
      rule: drift/finding-driven calibration runs A3-A9 only; no closure actions;
            current update still via explicit change (GI-03)
    - id: E-early-reject
      rule: lightweight closure allowed when no source change / persistent side
            effect / current transition exists   # §75
    - id: E-late-reject
      rule: persistent side effects must be reconciled/recovered/retained/transferred
            before closure even when decision is rejected   # §76
    - id: E-high-risk-hardening
      rule: machine-readable obligation set / concurrency guard / reconciliation
            scans / policy-as-code allowed; never imposed on all projects   # §100

  evidenceByWork:
    natural:
      - calibration records (subject + delta + disposition + evidence ref)
      - authority-backed commit facts (§47 fields, in the real authority source)
      - transition ledger entries (references to facts)
      - closure basis reference set
      - closure decision record
    extraOnlyFor: [disposition rationale, transfer acceptance, exception terms]
    rule: small teams may fold into one issue; semantics never skippable

  currentUpdateObligation:
    writesCurrent: true    # the sole calibration/closure procedure executing current commits
    boundaries:
      - earlier committed transitions (requirement / accepted release / runtime) are
        committed by their source procedures under authority; SP-19 verifies commit
        facts, never re-fakes timing   # SP-15 / SP-17
      - update-accepted-authority passes the concern's real authority decision first
      - no other SP writes current; rule unchanged
    supersedes: >
      The group-1/2 interim rule ("before SP-19 lands, current calibration/update =
      explicit recorded change by domain authority") is formally succeeded by this
      procedure upon SEAL; group-2 pending markers are to be updated as a group-3
      regression checklist item.

  theoryTrace:
    part1: [GI-02, GI-03, GI-05, GI-07, GI-11, GI-12]
    part2: [what-authorities-consumed-as-accepted-basis]
    part3: [ch8-calibration-direction, observed-evidence-not-authority,
            structure-finding-not-auto-update, health-affected-current]
    part4: [ch1-record-state-terminal-disposition-ledger, ch9-full,
            ch9-minimum-requirements-checklist, ch2-ch8-return-interfaces]

  executableAssets: [EA-17, EA-01]
  assetRule: >
    tooling fits: concurrency guard checks, field completeness verification, ledger
    recording/resolution, drift scans (high-risk). Tooling does not fit: delta
    classification, disposition choice, transfer acceptance, closure decision.
    A filled template is never completeness evidence (GI-06).

  referenceProfiles:
    - id: RP-ONLINE-API-PY-GH
      bindings:
        current_design_structure_carrier: docs/current/*.md + registry (git-SHA bound)
        data_current: alembic head + backfill state record
        accepted_release_runtime: deployment record / release registry
        ledger: current-update section inside change record (reference style)
    - id: RP-B-CLI   # pending-definition (group-6)
      bindings:
        runtime_current: absent            # explicitly declared
        accepted_release: published artifact version + channel
    - id: RP-C-SDK   # pending-definition (group-6)
      bindings:
        runtime_current: absent
        accepted_release: published artifact version + channel

  example:
    ref: CHG-WO-142
    continues: P4 Ch9 §84-96 work-order transfer upgrade   # PASS branch; the canary
                                                           # FAIL branch is exercised in
                                                           # the SP-15 / SP-17 examples
    highlight: >
      Design subject finds a material delta (notification-worker writes the
      work_order table directly) -> FIX_REALITY back to Ch3 / Ch4 / Ch5 (P4 Ch9
      §87), then ALIGNED after
      repair; data subject commits DT-203 to the data authority before the ledger
      entry; commit guard catches concurrent CHG-139 S20->S21 on the runtime mapping
      (material) -> reconciliation produces S22; adapter A7 exit transfers to
      maintenance change M-17 with traceable acceptance; revalidation passes ->
      CLOSED + COMPLETED with closure basis CB-WO-142-v1, full history preserved.
