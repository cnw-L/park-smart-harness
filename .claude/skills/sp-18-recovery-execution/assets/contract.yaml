# SP-18 Recovery Execution — Operation Contract
# Machine-loadable mirror of 第五篇-SP18-RecoveryExecution-正式操作规程.md
# The Markdown body is the normative source; this contract is its structured projection
# for harness execution (park-smart-harness). Semantics must not diverge: if they do,
# repair the projection, never the reverse (GI-13).
apiVersion: spec.part5/v1alpha1
kind: OperationContract
metadata:
  id: SP-18
  name: Recovery Execution
  status: sealed                   # 2026-09-01 group-5 audit PASS AFTER REPAIR (P1 x2 applied) + regression PASS
  version: 1.0.0
  normativeSource: 第五篇-SP18-RecoveryExecution-正式操作规程.md
  singleResponsibility: >
    Execute a delivery / operational failure that needs recovery to an explicit,
    safe, verifiable target state: make the recovery decision on the trigger /
    decision-input / anchor facts provided by SP-15, select and execute the
    recovery means (rollback / rollforward / disable feature / restore data /
    compensation / traffic shift / failover / pause), complete the recovery
    attempt execution record (formally taking over the duty previously
    performed by SP-15 under Ch7 §89-102), maintain repair-script and
    rehearsal assets, and hand recovery-validation verdicts to SP-17.
    Recovery != rollback; recovery-command success != recovery complete; a
    recovery anchor must really exist before it is relied upon; failed
    attempts / partial states / recoveries are historical engineering facts
    and are never deleted.

spec:

  triggers:
    - id: T-in-delivery-loop-recovery    # SP-15 proceed=STOP / target validation
                                         # FAIL / invariant broken / canary bad /
                                         # data mismatch (JG-06, JG-07)
    - id: T-incident-recovery-stabilization   # SP-21 needs recovery / stabilization
                                         # actions (JG-08: SP-21 -> SP-18 -> SP-17)
    - id: T-recovery-asset-governance    # repair-script maintenance, rehearsal /
                                         # recovery smoke (EA-16), pre-release
                                         # execution readiness (P2 Ch11 §61)
    - id: T-forward-fix-routing          # the recovery itself needs new software
                                         # content (Ch7 §97)
  redLine: >
    Recovery never defaults to binary rollback (§90); a recovery anchor must be
    verified to really exist before being relied upon (§94 [BASELINE]) —
    discovering at incident time that the old artifact is deleted / schema
    incompatible / no backup exists is a violation, not an accident.

  inputs:
    required:
      - name: recovery_handoff_package
        type: reference-set           # SP-15 A12: trigger + actual state +
                                      # failure/unknown evidence + Ch4 recovery
                                      # direction + data/contract compatibility
                                      # result + anchor authenticity result (§91-94)
      - name: recovery_asset_state
        type: reference-set           # repair script inventory & versions
                                      # (EA-16), latest rehearsal evidence,
                                      # backup / recovery inventory (P3 Ch6 §83)
    conditional:
      - name: migration_backfill_state
        type: ref                     # SP-08: migration stage, pausable points,
                                      # reconciliation watermark
        appliesWhen: recovery touches migration / backfill
      - name: exposure_asset_facts
        type: ref                     # SP-16: flag state / kill-switch trigger
                                      # conditions
        appliesWhen: disable-feature means considered
      - name: incident_context
        type: ref                     # SP-21: mitigation objective / stabilization
                                      # fact
        appliesWhen: trigger-B incident path

  outputs:
    primary:
      - name: recovery_decision
        fields: [chosen-strategy, decision-basis]   # pause / rollback / rollforward /
                                      # restore / compensate / shift-traffic / failover
                                      # or combination (§92, §96)
      - name: recovery_attempt_record
        rule: §98 nine fields completed on the execution side (attempt id / trigger /
              starting state / strategy / anchor / actions / evidence / final
              observed state / validation) — this procedure formally takes over the
              execution-record duty previously performed by SP-15
      - name: recovery_execution_facts
        rule: chosen means executed + authority-token confirmation facts (inside
              the SP-15 control frame)
      - name: recovery_validation_fact_set
        rule: old artifact truly running / data readable / critical flow restored /
              migration-traffic safe (§99-100) -> handed to SP-17 for verdict
      - name: forward_fix_routing_decision
        rule: new software content returns to the normal chain (SP-06 -> SP-13) or
              the Ch8 compressed path + mandatory after-the-fact reconciliation (§97)
      - name: recovery_asset_facts
        rule: repair-script versions, rehearsal records, execution-readiness
              conclusion (EA-16 evidence face)
    nonOutputs:
      - trigger-identification-decision-inputs-anchor-verification   # SP-15
      - recovery-validation-verdict                        # SP-17
      - post-recovery-accepted-current-release             # SP-17
      - emergency-semantics-and-after-the-fact-reconciliation   # SP-21 / Ch8
      - candidate-fix-implementation                       # SP-06 / SP-13
      - current-updates                                    # SP-15 runtime state / SP-19

  invariants:
    - id: recovery-not-equal-rollback
    - id: anchor-must-exist-before-relied-upon
    - id: binary-rollback-requires-compatibility-three-questions
    - id: command-success-not-recovery-complete
    - id: failed-history-never-deleted
    - id: recovery-actions-constrained-by-authority-token

  actions:
    - id: A1
      name: Entry and decision-input verification
      controlMode: guardrail
      rules:
        - receive the SP-15 handoff package (trigger / actual state / evidence /
          recovery direction / compatibility / anchor verification)
        - incomplete inputs (anchor unverified, compatibility unchecked) return to
          SP-15 — never start recovery actions on intuition with missing inputs
        - incident path (trigger B) equally fixes the equivalent inputs first
    - id: A2
      name: Recovery decision
      controlMode: engineering-decision
      rules:
        - choose among the §90 eight candidate means per §92 facts; decision basis
          in writing; no globally fixed choice (§96)
        - "cross-verify with migration / exposure facts: backfill pause requires the
          SP-08-designed pause point to exist; disable feature requires the SP-16
          flag / kill-switch asset and trigger conditions"
        - "anchor invalid (old artifact deleted / schema incompatible) -> never
          claim rollback viable: enter forward-fix routing (A7) and escalate the
          incident by risk (SP-21)"
    - id: A3
      name: Anchor binding and old-artifact use
      controlMode: automation-assisted
      rules:
        - "bind the decision to a concrete anchor (§93: previous accepted release /
          verified old artifact digest / database restore point / last reconciled
          migration watermark / stable traffic pool)"
        - rollback-type recovery uses the verified old artifact from the release
          archive — never rebuild an "old version" at incident time (P2 §60)
    - id: A4
      name: Execute (inside the target-changing action frame)
      controlMode: automation   # under SP-15 authority control
      rules:
        - execute the chosen means; before each recovery action SP-15 confirms the
          authority token is not superseded (§114-115)
        - non-idempotent actions under outcome unknown reconcile the actual result
          before continuing (Ch7 §42-44 same-source rule)
        - runtime state facts during execution are committed by SP-15 at execution
          time; this procedure never writes current directly
    - id: A5
      name: Recovery attempt execution record
      controlMode: automation
      rules:
        - "complete the execution side of the §98 framework opened by SP-15:
          actions / evidence / final observed state (validation-field facts go to
          A6 for SP-17 to verdict)"
        - this is the formal succession point of the execution-record duty
          previously performed by SP-15
    - id: A6
      name: Recovery validation fact collection and handoff
      controlMode: automation-assisted
      rules:
        - "collect §99-100 validation facts: actually running artifact, data
          readability, critical business flow restored, migration / traffic safe"
        - hand the fact set to SP-17 for the verdict (verdict semantics = §100
          [BASELINE] consumed there; post-recovery accepted current release =
          SP-17 / §101)
        - validation failing opens a new recovery attempt or escalates the incident
          (SP-21); unverified states are never reported as recovered (GI-06)
    - id: A7
      name: Forward fix routing
      controlMode: engineering-decision
      rules:
        - recovery needing new source / new artifact / new contract returns in
          principle to SP-06 (implementation) -> SP-13 (candidate / verification)
          before delivery; emergency scenarios use the SP-21 / Ch8 compressed path
          + mandatory after-the-fact reconciliation / verification (§97)
        - candidate defects effectively proven in target (Ch7 §105) return with the
          handoff package to SP-13 for disposition re-evaluation
    - id: A8
      name: Recovery assets and rehearsal
      controlMode: engineering-decision + automation
      rules:
        - maintain versioned repair-script assets (rollback / forward / repair
          script, EA-16) and their availability
        - complete recovery-path rehearsal / recovery smoke before high-risk
          releases (EA-16 evidence face), supporting SP-15's entry condition
          (§32 recovery direction) and authorization basis ("previous safe
          artifact retained")
        - backup / recovery inventory kept as inspectable evidence (P3 Ch6 §83);
          answerability of the P2 §61 five questions (when stop / when rollback /
          when only forward fix / how data recovers / who decides) guaranteed
          executable by this procedure

  gates:
    - id: G-SP18-01
      type: hard-gate
      rule: recovery-never-defaults-to-rollback
      note: means selection based on actual state / failure evidence / compatibility /
            anchor; eight candidates chosen by facts   # §90-92, §96; P2 Ch11 §58
    - id: G-SP18-02
      type: hard-gate
      rule: anchor-verified-real-before-relied-upon
      note: rollback-type recovery uses saved verified old artifacts, never incident-time
            rebuilds of the old version   # §94, P2 Ch11 §60
    - id: G-SP18-03
      type: hard-gate
      rule: binary-rollback-requires-compatibility-three-questions
      note: old binary reads new data / old consumer uses new contract / migration
            allows rollback   # §95, P2 Ch11 §59
    - id: G-SP18-04
      type: hard-gate
      rule: command-success-is-not-recovery-complete
      note: actual state confirmed after control-plane success before verdict handoff
            # §99
    - id: G-SP18-05
      type: hard-gate
      rule: attempt-nine-fields-complete; failed-history-never-deleted
      note: # §98, §102, P2 Ch11 §62
    - id: G-SP18-06
      type: hard-gate
      rule: recovery-actions-confirm-authority-token-before-execution
      note: incl. delayed rollback / automated recovery / traffic revert / feature
            disable; never bypasses the SP-15 control frame   # §114-115
    - id: G-SP18-07
      type: hard-gate
      rule: forward-fix-with-new-software-content-returns-to-normal-chain-or-ch8
      note: SP-06 -> SP-13, or compressed path + mandatory after-the-fact
            reconciliation; never bare in-place edits   # §97
    - id: G-SP18-08
      type: hard-gate
      rule: high-risk-release-recovery-execution-readiness-before-release
      note: anchor / scripts / rehearsed path ready (P2 Ch11 §61, EA-16) —
            "theoretically rollback-able" is not readiness   # §94
    - id: G-SP18-09
      type: hard-gate
      rule: gate-zeroing-classification-requires-resolvable-rationale
      note: covers down.sql-means-recoverable / backup-exists-means-recoverable /
            internal-tool-needs-no-recovery / low-risk-just-retry; re-challengeable
            by SP-05 / SP-13 / group audit   # B1

  passExit:
    equals: >
      Recovery complete (bound to a recovery attempt): chosen means fully executed
      with authority-token confirmation facts on record + recovery attempt
      nine-field record complete (incl. final observed state) + recovery validation
      fact set handed to SP-17 and verdicted + when applicable: forward-fix routing
      decision in writing, post-recovery current facts committed via SP-15 / SP-17
      -> handoff to SP-17 (verdict) / SP-21 (incident reconciliation, when
      applicable) / SP-13 (candidate re-evaluation, when applicable)
    doesNotMean: [target-redelivered, change-closed, incident-closed,
                  root-cause-fixed]

  returnPaths:
    - condition: decision inputs incomplete (anchor unverified / compatibility unchecked)
      next: return to SP-15 for completion
    - condition: recovery validation fails
      next: new recovery attempt or incident escalation (SP-21); never report
            recovered
    - condition: anchor invalid with no substitute
      next: forward-fix routing (A7) + incident escalation assessment
    - condition: recovery action outcome unknown
      next: reconcile the actual result first (Ch7 §42-44 same-source rule), never
            blind retry
    - condition: old recovery action superseded by newer intent
      next: abort per Ch7 §116 outdated-attempt rules (SP-15 control); never
            self-cover
    - condition: candidate defect
      next: SP-13 re-evaluation / SP-06 fix
    - condition: migration / backfill recovery-design gap
      next: SP-08
    - condition: material design problem (recovery path itself unsound)
      next: SP-05

  exceptions:
    - id: E-recovery-action-outcome-unknown
      rule: partially failed / unknown-outcome recovery actions reconcile the actual
            target state first (Ch7 §42-44 same-source rule) before continuing /
            retrying / switching means; non-idempotent (data-writing) actions are
            never blindly retried
    - id: E-no-viable-anchor
      rule: "old artifact deleted / schema incompatible / no backup — rollback being
            infeasible is a fact, not an attitude failure: enter forward fix (A7),
            escalate the incident by impact (SP-21); the condition itself enters
            engineering health and release-archive retention improvement (SP-09
            domain retention facts)"
    - id: E-destructive-data-change-already-happened
      rule: migrations already producing destructive changes take restore-data /
            compensation paths; with any of the backup four elements missing (P2
            Ch8 §49, SP-08 domain) recovery must not be claimed — register the
            evidence gap truthfully and hand to SP-17 for NOT_READY semantics
    - id: E-emergency-compressed-execution
      rule: boundary between recovery and emergency change — system-stabilizing
            recovery actions run in this procedure; emergency fixes needing new
            software content use the SP-21 / Ch8 compressed path (what is compressed
            is the obligation's timing, not the obligation itself); recovery actions
            themselves stay authority-token constrained

  evidenceByWork:
    natural:
      - recovery decision record (path + basis + cross-verification)
      - recovery attempt record (§98 nine fields)
      - anchor verification and old-artifact-use facts (digest comparison)
      - authority-token confirmation facts (per recovery action)
      - recovery validation fact set (input handed to SP-17)
      - repair-script versions and rehearsal records (EA-16)
      - failure history (attempt / partial state / recovery — retained, never deleted)
    extraOnlyFor: [gate-zeroing-classification-rationale,
                   forward-fix-routing-rationale,
                   anchor-invalidation-escalation-decision]
    rule: all other evidence emerges naturally from the work

  currentUpdateObligation:
    writesCurrent: false
    boundaries:
      - environment current runtime state changes caused by recovery actions are
        committed by SP-15 at execution time (authority-endorsed, updated with real
        recovery facts; mixed / recovering states recorded truthfully)
      - post-recovery accepted current release belongs to SP-17 (§101)
      - project-level current (incl. design / structure revisions arising from
        recovery) belongs to SP-19
      - any formal current baseline migration goes explicitly through SP-19

  theoryTrace:
    part1: [GI-03, GI-05, GI-06]     # command success != complete is GI-06 applied
    part2: [p2-ch11-58-62-rollback-not-only-answer-execution-side-what]
    part3: [p3-ch3-mixed-recovering-state-truthful-expression,
            p3-ch3-runtime-relevant-change-includes-release-recovery,
            p3-ch6-operational-owner-backup-failover-inventory,
            p3-ch6-recovery-restore-what-boundary-defers-to-p2-p4-sp08]
    part4: [ch7-89-102-recovery-core-execution-authority,
            ch7-42-44-outcome-unknown-reconcile,
            ch7-114-116-authority-token-constrains-recovery-actions,
            ch7-122-132-workorder-canary-fail-recovery-r1,
            ch7-139-recovery-must-items]
    journey: [JG-06, JG-07, JG-08]   # release failure / post-delivery exception /
                                      # incident recovery-stabilization

  executableAssets: [EA-16, EA-15]
  assetRule: >
    tooling fits: script execution, anchor digest comparison, state collection,
    attempt-record maintenance, rehearsal orchestration. Tooling does not fit:
    recovery decisions (path choice), anchor-authenticity verdicts, validation
    verdicts (SP-17), "looks fine"-style completion judgments — tool output is a
    signal, never a verdict (GI-07). A filled template is never decision evidence
    (GI-06).

  referenceProfiles:
    - id: RP-ONLINE-API-PY-GH
      bindings:
        rollback: redeploy by verified image digest + traffic back to stable pool
        restore: database PITR / snapshot
        repair_scripts: versioned in repo
        rehearsal: staging recovery smoke (EA-16)
    - id: RP-B-CLI   # pending-definition (group-6)
      bindings:
        server_side_rollback: none — recovery = redistribute old version /
                              withdrawal record
        local_data: migration rollback limited, fix-first
        recovery_scripts: versioned with distribution
    - id: RP-C-SDK   # pending-definition (group-6)
      bindings:
        forced_rollback: impossible consumer-side — recovery = publish patch
                         version + compatibility guidance / migration notes
        yanking: distribution-face action (SP-15 §11)
        recovery_semantics: guide consumers to a safe version

  example:
    ref: CHG-WO-142
    continues: SP-15 example A11-A12 and SP-17 example (group-3) — WO-1.9.0 canary
               S1 = 5% traffic on Production-US, new-version transfer error
               material, old version normal -> proceed = STOP, delivery finding =
               candidate defect discovered in target. This example covers SP-18's
               execution side (recovery R1)
    highlight: >
      Handoff package received from SP-15: trigger = canary bad (§91); actual
      state = mixed 1.8/1.9 (S1 5% new traffic); compatibility verified = v1.8
      still reads the expanded schema / data (V203 is a backward-compatible
      expand, SP-08 design fact); anchor verified = verified v1.8 artifact digest
      available in the release archive (same fact as the authorization basis
      "previous safe artifact retained"). Decision = traffic revert + artifact
      rollback (combined means), basis = schema expand itself backward compatible
      -> no destructive rollback needed (§129-130). Anchor bound to the verified
      v1.8 digest (no rebuild — P2 §60); migration expand retained, backfill-pause
      target = S5 reindex backfill (the batch / pause-resume / checkpoint /
      reconciliation mechanism designed by SP-08, the fact registered in the
      group-4 baseline index). Execution: traffic -> stable pool, artifact ->
      v1.8, migration expand retained, backfill pause — each action authority-token
      confirmed via SP-15 first (§114: traffic-revert-class actions equally
      constrained). Attempt R1 nine fields completed (trigger / starting state =
      mixed / strategy = revert+rollback / anchor = v1.8 digest / actions /
      evidence / final observed state) — SP-15's performed-by-proxy record duty
      formally transfers to this procedure here. Validation facts: 100% v1.8
      serving, critical transfer flow healthy, new bad path inactive, data
      consistent -> handed to SP-17: recovery validation PASS, accepted current
      release stays 1.8 (target scope = Production-US, §131); environment current
      runtime state = recovered v1.8 + expanded schema (SP-15 execution-time
      commit). Forward-fix routing: FAIL root cause = candidate logic defect ->
      C2 disposition re-evaluated, fix via SP-06 -> C3 -> SP-13 re-verification ->
      new release / attempt (§132) — no bare in-place edits. Rehearsal facts: the
      R1 path rehearsed on staging before release WO-1.9.0 (EA-16
      rehearsal/smoke); the traffic-revert repair script versioned in repo, the
      release archive retains the v1.8 digest (SP-14 / SP-09 domain facts).
