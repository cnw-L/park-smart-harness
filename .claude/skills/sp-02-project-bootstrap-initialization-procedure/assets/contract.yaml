# SP-02 Project Bootstrap / Initialization Procedure — Operation Contract
# Machine-loadable mirror of 第五篇-SP02-ProjectBootstrapInitializationProcedure-正式操作规程.md
# The Markdown body is the normative source; this contract is its structured projection
# for harness execution (harness-agnostic). Semantics must not diverge: if they do,
# repair the projection, never the reverse (GI-13).
# projection backfilled during final full-spec horizontal regression (2026-09-01); SP-02 MD is the normative source
apiVersion: spec.part5/v1alpha1
kind: OperationContract
metadata:
  id: SP-02
  name: Project Bootstrap / Initialization Procedure
  status: sealed   # 2026-08-19 group-1 Concept Audit (PASS AFTER REPAIR, P1x5 / P2x2 fixed)
                  # + Formal Audit + horizontal regression + CLI Shape adversarial regression;
                  # SEALED status line backfilled 2026-09-01 (group-1 sealed before the
                  # status-line convention established from group-2 onward)
  version: 1.0.0
  normativeSource: 第五篇-SP02-ProjectBootstrapInitializationProcedure-正式操作规程.md
  singleResponsibility: >
    Establish / re-validate Project Engineering Foundation Readiness at the
    R0 / R1 / R2 / R3 Checkpoints. Not a project state machine (不是项目状态机):
    R0-R3 express Readiness only, never Project Lifecycle State, and never
    replace Part IV Change / Candidate / Release / Closure. Callable separately
    at each checkpoint.

spec:

  triggers:                              # MD §1
    - id: T-greenfield-project-creation                # A. 创建 Greenfield 项目
    - id: T-prototype-to-formal-governance             # B. Prototype 转正式治理
    - id: T-existing-project-foundation-gap-assessment # C. 已有项目 Foundation Gap Assessment
    - id: T-first-change-reaching-r1-r2-r3-checkpoint  # D. First Change 到达 R1/R2/R3 Checkpoint
    - id: T-foundation-context-materially-changed      # E. Foundation Context materially
                                                       #    changed, needs Revalidation (§14)

  boundaryRule: >
    Not a project state machine; may be invoked at R0 / R1 / R2 / R3
    independently. Readiness only: R0-R3 do not represent Project Lifecycle
    State and do not substitute for Part IV Change, Candidate, Release or
    Closure (MD header + §18).

  inputs:                                # MD §2 ("至少" — these are the minimum set)
    required:
      - name: initialization_mode
        type: enum [greenfield, prototype-cutover, gap-assessment, revalidation]
      - name: project_scope
        type: scope-ref
      - name: current_or_bootstrap_reality
        type: reference-set   # truthful Current / Bootstrap Reality; absent/none is a
                              # legitimate fact, never fabricated future facts
      - name: owner
        type: ref             # Project / Technical Owner must exist / be resolvable
      - name: foundation_applicability_profile
        type: reference-set   # per-concern Applicable / Deferred / N/A dispositions (§9)
      - name: reference_profile
        type: ref
      - name: checkpoint
        type: enum [R0, R1, R2, R3]
    conditional:
      - name: current_change_id
        type: ref
        rule: usually present at R1+ (R1+ 通常存在)

  outputs:                               # MD §3
    primary:
      - name: readiness_pass_verdict
        rule: per invoked checkpoint — R0 Governance Bootstrap Ready / R1
              Development Foundation Ready / R2 Shared Integration Foundation
              Ready / R3 Delivery Foundation Ready (§16 gate matrix)
      - name: readiness_not_ready_verdict
      - name: deferred_foundation_obligation
        fields: [activation_trigger, owner]        # §9
      - name: foundation_finding
      - name: foundation_remediation_change
        rule: emitted as a normal engineering change through the regular chain,
              not fixed in place here
      - name: readiness_evidence
      - name: continuation_handoff
    nonOutputs:                           # MD §3 "SP-02 不输出"
      - candidate-accepted
      - delivery-authorized
      - target-validation-pass
      - change-closed
      - project-lifecycle-state           # §18: R0-R3 只表示 Readiness

  invariants:
    - id: proof-over-artifacts
      rule: files-exist / docs-say-ready never produce a PASS; readiness is proven
            by executing applicable commands in a clean/reproducible environment
            # MD §6.3-6.4
    - id: bootstrap-privilege-bounded
      rule: bootstrap privilege may only create initial controlled facts; it cannot
            be indefinitely deferred; after cutover material current changes go
            through Part IV Engineering Change   # MD §5
    - id: deferred-requires-trigger-and-owner
      rule: every Deferred concern carries an Activation Trigger and an Owner   # MD §9
    - id: execution-asset-versions-identifiable   # MD §10
    - id: developer-and-ci-paths-semantically-aligned   # MD §11
    - id: no-real-secrets-in-templates            # MD §12
    - id: readiness-not-a-permanent-certificate   # MD §14
    - id: readiness-not-lifecycle-state           # MD §18

  actions:
    - id: A1
      name: R0 — establish governance bootstrap facts   # MD §4.1 必须建立
      controlMode: engineering-decision
      rules:
        - >-
          Must establish: Stable Project Identity; Project / Technical Owner;
          Engineering Scope; Repository / Source location; Technical Entry;
          Truthful Bootstrap Current / Reality; Foundation Applicability Profile;
          Requirement / Trigger Authority navigation
    - id: A2
      name: R0 — clean-environment proof   # MD §4.2
      controlMode: automation
      rules:
        - >-
          At minimum: fresh clone -> open technical entry -> locate
          setup/run/test/build commands -> resolve current/change navigation
        - greenfield may verify only the Bootstrap Technical Shell (§4.2, also E1)
    - id: A3
      name: Record Engineering Governance Cutover   # MD §5
      controlMode: engineering-decision
      rules:
        - >-
          After R0 PASS record: effective_at; decision / owner; bootstrap
          baseline refs
        - after cutover, Material Current Change goes through Part IV Engineering Change
        - >-
          bootstrap privilege may only create initial controlled facts; it cannot
          be indefinitely deferred
    - id: A4
      name: R1 — determine applicability   # MD §6.1
      controlMode: engineering-decision
      rules:
        - >-
          applicability decided by: Accepted Requirement; Impact; Accepted Design /
          Design Direction; Delivery Shape; Risk
    - id: A5
      name: R1 — check minimum concerns   # MD §6.2 最低 Concern
      controlMode: engineering-decision
      rules:
        - repeatable local environment; controlled dependency resolution;
          configuration rule; secret rule; test / verify entry; relevant source /
          boundary navigation; security/toolchain access; migration mechanism if
          persistent schema is introduced; contract source if public contract is
          introduced
    - id: A6
      name: R1 — readiness proof   # MD §6.3-6.4
      controlMode: automation
      rules:
        - execute applicable commands in a clean/reproducible environment, e.g.
          dependency sync; unit test; integration harness startup; migration
          empty-db smoke (if applicable); application technical shell startup
          (if applicable)
        - NOT_READY must not pass merely because files exist or docs say ready
    - id: A7
      name: R2 — verify shared integration foundation   # MD §7.1 必须有
      controlMode: engineering-decision
      rules:
        - >-
          must have: Shared Source Authority; Controlled Integration Path;
          Required Fast Verification; CI / equivalent automation; Repeatable
          Build; Visible Check Result; Broken Baseline handling; Execution
          Asset Version Binding
    - id: A8
      name: R2 — staged control activation   # MD §7.2
      controlMode: automation-assisted
      rules:
        - >-
          recommended order: create verify/CI -> run successfully -> stabilize
          check identity -> configure Hard Gate -> intentionally prove a failing
          change is blocked -> record control evidence
        - the tool need not be GitHub
    - id: A9
      name: R3 — verify delivery foundation   # MD §8.1-8.3
      controlMode: engineering-decision
      rules:
        - >-
          must have: Output / Artifact Identity; Target / Channel / Environment
          Identity; Config / Secret Injection; Delivery / Distribution Entry;
          Migration Execution (if applicable); Observation / Diagnostics; Target
          Validation Entry; Recovery / Withdrawal Direction; Delivery Authority
        - >-
          online service face (§8.2), typically: version; logs;
          health/readiness as applicable; critical error visibility;
          metrics/traces by risk
        - >-
          CLI / library face (§8.3) may be: package/binary identity; release
          channel; checksum / artifact; install/run smoke; diagnostic
          exit/error; withdraw / replace direction — server health not required
    - id: A10
      name: Dispose foundation applicability per concern   # MD §9
      controlMode: engineering-decision
      vocabulary: [Applicable, Deferred, N/A]
      rules:
        - Deferred must carry an Activation Trigger and an Owner
        - >-
          e.g. Migration: Deferred / Trigger: first persistent schema introduced
    - id: A11
      name: Bind execution asset versions   # MD §10
      controlMode: automation-assisted
      rules:
        - >-
          version-identifiable assets: Starter; Reusable Workflow; Action;
          Build Image; Policy; Migration Template; Deployment Adapter
        - >-
          allowed policies: immutable SHA; versioned tag; controlled stable
          channel — but consumer / compatibility / upgrade / rollback must be
          explicit
    - id: A12
      name: Verify execution command contract   # MD §11
      controlMode: automation
      rules:
        - >-
          each profile provides at least the logical capabilities: setup/sync;
          run; test; verify; build/package; migrate; smoke/validate — exact
          platform wording need not match
        - developer path and CI path must be semantically aligned
    - id: A13
      name: Enforce secret / target rules   # MD §12
      controlMode: automation + guardrail
      rules:
        - >-
          template MAY contain: .env.example; secret names; schema / sample
          non-secret values
        - >-
          template MUST NOT contain: production secrets; private keys; real
          tokens
        - profile default name is not the real project target authority
    - id: A14
      name: Trigger readiness revalidation on material changes   # MD §14
      controlMode: automation-assisted
      rules:
        - >-
          revalidate on: dependency tool changed; CI workflow replaced; build
          platform changed; repository control removed; runtime packaging
          changed; deployment mechanism changed; secret model changed; new DB
          introduced; public contract introduced
        - readiness is not a permanent certificate
    - id: A15
      name: Tailor to small team profile   # MD §15
      controlMode: engineering-decision
      rules:
        - >-
          minimum may be: README; repository; simple scripts; version control;
          automated tests; simple CI; package/build
        - not required: IDP; Backstage; Kubernetes; CAB; multi-reviewer

  gates:
    - id: G-SP02-01
      type: hard-gate
      rule: r0-must-establish-facts-present
      note: the eight §4.1 items (identity, owner, scope, repo/source, technical
            entry, truthful bootstrap reality, applicability profile, authority
            navigation) all established
    - id: G-SP02-02
      type: hard-gate
      rule: r0-clean-environment-proof-executed
      note: fresh clone -> technical entry -> command location -> current/change
            navigation resolved (§4.2); greenfield may limit to the Bootstrap
            Technical Shell
    - id: G-SP02-03
      type: hard-gate
      rule: r0-pass-means-normal-change-establishable-without-inventing-current
      note: §4.3 PASS definition
    - id: G-SP02-04
      type: hard-gate
      rule: governance-cutover-recorded-and-bootstrap-privilege-bounded
      note: effective_at + decision/owner + bootstrap baseline refs recorded;
            bootstrap privilege only creates initial controlled facts and cannot
            be indefinitely deferred; after cutover material current changes go
            through Part IV   # MD §5
    - id: G-SP02-05
      type: hard-gate
      rule: r1-pass-requires-clean-environment-proof
      note: applicable commands executed in a clean/reproducible environment;
            files-exist and docs-say-ready are never sufficient   # MD §6.3-6.4
    - id: G-SP02-06
      type: hard-gate
      rule: r2-shared-baseline-entry-requires-integration-control-must-haves
      note: the eight §7.1 items; tool need not be GitHub
    - id: G-SP02-07
      type: hard-gate
      rule: r3-pass-does-not-mean-release-deployment-validation-success
      note: R3 PASS only means the system is capable of safely executing those
            actions — not release authorized, not deployment succeeded, not
            target validation passed   # MD §8.4
    - id: G-SP02-08
      type: hard-gate
      rule: deferred-concern-requires-activation-trigger-and-owner   # MD §9
    - id: G-SP02-09
      type: hard-gate
      rule: execution-assets-version-identifiable-with-consumer-compat-upgrade-rollback
      note: Starter / Reusable Workflow / Action / Build Image / Policy /
            Migration Template / Deployment Adapter; immutable SHA / versioned
            tag / controlled stable channel   # MD §10
    - id: G-SP02-10
      type: hard-gate
      rule: developer-and-ci-paths-semantically-aligned   # MD §11
    - id: G-SP02-11
      type: hard-gate
      rule: no-production-secrets-private-keys-real-tokens-in-template
      note: MUST NOT — MD §12; template MAY carry .env.example / secret names /
            schema-sample non-secret values only
    - id: G-SP02-12
      type: hard-gate
      rule: readiness-revalidation-on-material-foundation-changes
      note: the nine §14 change classes trigger revalidation; readiness is not a
            permanent certificate
    - id: G-SP02-13
      type: note
      rule: r2-staged-control-activation-is-recommended-not-mandatory   # MD §7.2 推荐
      note: six-step staged activation incl. intentionally proving a failing
            change is blocked; recording control evidence

  passExit:                              # MD §16 gate matrix + per-checkpoint PASS
    equals: >
      For the invoked checkpoint, every applicable concern has passed its
      readiness proof with evidence on record; inapplicable concerns are
      dispositioned N/A; deferred concerns carry activation trigger + owner.
      R0 -> Governance Bootstrap Ready; R1 -> Development Foundation Ready;
      R2 -> Shared Integration Foundation Ready; R3 -> Delivery Foundation Ready.
    minimumConditions:
      R0: [g-SP02-01 facts, g-SP02-02 clean-environment proof,
           g-SP02-03 pass meaning]
      R1: [applicability determined per §6.1, applicable §6.2 minimum concerns
           satisfied, §6.3 readiness proof executed]
      R2: [§7.1 eight must-haves in place]
      R3: [applicable §8.1 must-haves in place]
    doesNotMean: [project-lifecycle-state, release-authorized,
                  deployment-succeeded, target-validation-passed,
                  candidate-accepted, change-closed]

  returnPaths:                           # MD §17
    - condition: R0 NOT_READY
      next: fix bootstrap truth / owner / navigation
    - condition: R1 NOT_READY
      next: establish missing dev/test/migration/config foundation
    - condition: R2 NOT_READY
      next: repair CI / build / integration control
    - condition: R3 NOT_READY
      next: establish artifact/target/deploy/observe/recovery foundation
    - condition: material design changes applicability
      next: Ch3 / Ch4 reconcile

  exceptions:
    - id: E-greenfield-technical-shell-only
      rule: greenfield R0 proof may be limited to the Bootstrap Technical Shell
            # MD §4.2
    - id: E-r2-solo-small-team
      rule: >
        without a multi-person shared baseline, R2 may be lightweight / N/A;
        but once shared source, release branch, or published package exists, a
        risk-matched controlled integration path is still required   # MD §7.3
    - id: E-isolated-engineering-spike
      rule: >
        before R1, an isolated experiment may be allowed under: no accepted
        current write; no production; no shared product baseline; evidence
        traceable   # MD §13
    - id: E-small-team-profile
      rule: >
        minimum carrier may be README / repository / simple scripts / version
        control / automated tests / simple CI / package-build; IDP, Backstage,
        Kubernetes, CAB, multi-reviewer are not required   # MD §15

  evidenceByWork:
    natural:
      - clean-environment proof run records (R0/R1/R3 readiness evidence)
      - governance cutover record (effective_at / decision-owner / bootstrap
        baseline refs)
      - foundation applicability profile per concern (Applicable / Deferred / N/A)
      - deferred obligation records (activation trigger + owner)
      - R2 control evidence (incl. failing-change-blocked proof when staged
        activation is followed)
      - revalidation records after §14 material changes
    extraOnlyFor: [applicability-judgment-rationale, deferred-decision,
                   r2-lightweight-classification]
    rule: readiness evidence emerges naturally from the executed proof runs

  currentUpdateObligation:
    writesCurrent: false
    boundaries:
      - SP-02 never writes project engineering current itself; the bootstrap
        privilege (§5) is limited to creating initial controlled facts and is
        bounded by the cutover record
      - after cutover, material current changes go through Part IV Engineering
        Change — never re-entered via bootstrap privilege
      - foundation gaps are emitted as Foundation Findings / Foundation
        Remediation Changes and executed through the normal change chain

  theoryTrace:                           # master map §Procedure/Theory table row SP-02
    part2: [project-engineering]
    part3: [scope, source, runtime, current]
    part4: [ch1, ch2]
    journey: JG-01   # 新项目从 0 到第一条正常 Change: SP-02 -> SP-03 (first change)

  executableAssets:   # mapped from MD §4.2 / §6.2 / §7.1 / §10 asset classes
    - EA-01   # Execution Navigation — §4.2 technical entry / navigation proof
    - EA-02   # Project Template (Starter) — §10
    - EA-03   # Dev Environment — §6.2 repeatable local environment
    - EA-04   # Task Runner / Scripts — §6.2 / §11 command contract
    - EA-06   # Repository Rules — §7.1 controlled integration path / broken baseline handling
    - EA-07   # Reusable CI — §7.1 CI / equivalent automation
    - EA-09   # Migration Template — §6.2 migration mechanism / §10
    - EA-10   # Build Definition / Build Image — §7.1 repeatable build / §10
    - EA-12   # Deployment Definition (Deployment Adapter) — §10 / §8.1 delivery entry
  assetRule: >
    Version policies per MD §10: immutable SHA / versioned tag / controlled
    stable channel, with consumer / compatibility / upgrade / rollback made
    explicit. Logical command capabilities per MD §11: setup/sync, run, test,
    verify, build/package, migrate, smoke/validate — platform wording may
    differ; developer and CI paths must be semantically aligned.

  referenceProfiles:
    - id: RP-ONLINE-API-PY-GH
      bindings:
        r3_face: online service — version / logs / health-readiness / critical
                  error visibility / metrics-traces by risk (§8.2)
        command_contract: logical capabilities per §11, developer/CI aligned
    - id: RP-B-CLI
      bindings:
        r3_face: CLI face — package/binary identity, release channel,
                  checksum, install/run smoke, diagnostic exit, withdraw
                  direction; server health not required (§8.3)
    - id: RP-C-SDK
      bindings:
        r3_face: library face — same §8.3 CLI/library shape

  example:   # SP-02 MD has no §Example; anchored to JG-01 §7 greenfield example (SP-02's R0 face)
    ref: work-order-service greenfield bootstrap (JG-01)
    highlight: >
      Truthful Bootstrap Current: repository exists; source = bootstrap
      technical shell only; business implementation / business API / persistent
      business schema absent; accepted release none; production target not
      established — "absent / none" are legitimate Current Facts. R0 PASS means
      a normal Engineering Change can be established without inventing Current
      facts; governance cutover recorded (effective_at / owner / bootstrap
      baseline refs); migration concern Deferred with Trigger = first persistent
      schema introduced (§9 example).
