# SP-22 Execution Asset Lifecycle — Operation Contract
# Machine-loadable mirror of 第五篇-SP22-ExecutionAssetLifecycle-正式操作规程.md
# The Markdown body is the normative source; this contract is its structured projection
# for harness execution (harness-agnostic). Semantics must not diverge: if they do,
# repair the projection, never the reverse (GI-13).
apiVersion: spec.part5/v1alpha1
kind: OperationContract
metadata:
  id: SP-22
  name: Execution Asset Lifecycle
  status: sealed            # 2026-09-01 group-6 audit PASS AFTER REPAIR (P1x4 re-verified) + regression PASS AFTER REPAIR (Rx3, Nx5)
  version: 1.0.0
  normativeSource: 第五篇-SP22-ExecutionAssetLifecycle-正式操作规程.md
  singleResponsibility: >
    Govern the lifecycle of execution assets themselves — guides, templates,
    workflows, scripts, reference profiles, operation contract schemas —
    isomorphically with software: register every asset with its seven-element
    identity (owner / version / compatibility / tests / consumers /
    deprecation / replacement-migration), run asset modifications as normal
    engineering changes through the same change loop, judge asset version
    compatibility and consumer impact, maintain the guide current surface
    (which versions valid / superseded / mirror sync), dispose of guide drift,
    and prove real usability via golden path regression. Core fact: current
    asset version. An asset modification is itself an engineering change —
    "just a doc / template / script" is never a bypass; an asset without
    seven-element registration may not be referenced by consumers; publication
    mirrors and research evidence do not gain normative status by existing.

spec:

  triggers:
    - id: T-new-asset-creation            # first-time reusable asset (template repo /
                                           # reusable workflow / guide / profile / contract
                                           # schema / script set) needs registration + release
    - id: T-asset-modification-request    # defect in use, dependency / platform drift,
                                           # spec evolution input, feedback-loop evidence
    - id: T-asset-version-release         # new version needs compatibility judgment +
                                           # controlled rollout to consuming projects
                                           # (incl. breaking-change migration plans)
    - id: T-asset-exit-supersession-drift # asset replaced / retired, or a conflicting
                                           # non-owner surface for the same concern found
  redLine: >
    Asset modification is an engineering change (GI-03) — there is no second,
    looser "docs / templates / scripts can be edited casually" path; assets
    without seven-element registration must not be referenced; the guide
    current surface must answer P1 §10.2's five questions — when "which
    version is valid" is unanswerable, consumers are already chasing drift.

  inputs:
    required:
      - name: asset_trigger_facts
        type: reference-set           # feedback-loop evidence (breakage points, defects,
                                      # advisories), platform / tool drift signals, spec
                                      # evolution input (SP revisions obsoleting assets)
      - name: asset_registry_state
        type: reference-set           # existing assets, versions, seven-element status,
                                      # deprecation state
      - name: consumer_impact_facts
        type: reference-set           # which projects reference which version (workflow
                                      # pin / template instantiation / profile reference) —
                                      # facts, not judgment
      - name: asset_interface_facts
        type: reference-set           # the asset's consumer-facing interface: check names,
                                      # commands, directory conventions, schema fields,
                                      # generated structure (the object of compatibility
                                      # judgment)
      - name: golden_path_basis
        type: reference-set           # sample repo / regression matrix status (EA-19 face)
    conditional: []

  outputs:
    primary:
      - name: asset_registry_entry
        fields: [owner, version, compatibility, tests, consumers,
                 deprecation, replacement-migration]
      - name: asset_change
        rule: normal engineering change opened via SP-03, carrying trigger
              facts and consumer impact; scope explicitly includes the asset
              itself plus affected-consumer migration obligations
      - name: asset_compatibility_judgment
        rule: compatible / breaking judgment on the asset interface (four-perspective
              semantics reused from SP-07, not redefined); breaking changes carry a
              per-consumer migration plan (path / deadline / support window)
      - name: asset_version_release_record
        rule: progressive rollout (opt-in -> progressive -> default) with per-step
              rollback; version pin facts (no uncontrolled @main); breaking changes
              keep the old version usable through the transition window (deprecation
              semantics reused from SP-20)
      - name: guide_current_surface_update
        rule: valid versions / superseded versions (with supersession facts —
              successor, stop date) / mirror sync status / registry verification time
              (the answers to P1 §10.2's five questions)
      - name: guide_drift_disposition
        rule: register conflicting non-owner surface -> repair to designated owner
              (no compromise, no coexistence) -> cross-part regression (GI-12)
      - name: golden_path_regression_evidence
        rule: "asset proven usable on sample / matrix: findable, executable, gates
              really block (master map §G) — not author self-assessment"
      - name: asset_feedback_backlog
        rule: real-use evidence converted into asset improvement items
    nonOutputs:
      - change-establishment-and-baseline-binding      # SP-03
      - compatibility-judgment-framework-itself        # SP-07 (reused, not redefined)
      - asset-content-implementation                   # SP-06
      - local-candidate-validation-verdicts            # SP-11 / SP-13
      - rollout-execution-control                      # SP-15
      - deprecation-eol-retirement-semantics           # SP-20 (reused)
      - emergency-compression-semantics                # SP-21
      - consumer-project-level-current                 # SP-19 (each project)
      - professional-semantics-carried-by-the-asset    # designated owners of each part

  invariants:
    - id: asset-modification-is-engineering-change
    - id: asset-requires-seven-element-registration
    - id: asset-version-upgrade-requires-compatibility-judgment
    - id: asset-reference-pinned-to-committed-version
    - id: guide-current-surface-answerable
    - id: mirror-and-research-evidence-not-normative-by-existence
    - id: guide-drift-registered-and-repaired
    - id: usability-proven-by-golden-path
    - id: gate-zeroing-classification-requires-resolvable-rationale   # G-SP22-09

  actions:
    - id: A1
      name: Asset identity confirmation and registry entry
      controlMode: automation
      rules:
        - confirm the asset and version behind the trigger face; new assets enter
          the registry with all seven elements; existing assets checked for drift
          (no owner / no version / unknown consumers — treated as asset debt)
        - assets without seven-element registration may not be referenced;
          "internal asset, no registration needed" is gate-zeroing, carries
          rationale (B1)
    - id: A2
      name: Asset modification opened as a normal change
      controlMode: engineering-decision
      rules:
        - convert the request into an asset change via SP-03, carrying trigger
          facts, impact face (which consumers / which versions), modification intent
        - scope explicitly includes the asset itself and affected-consumer
          migration obligations
        - "B1 re-challenge: \"it's just docs\" fails — a doc is an asset, an asset
          change is an engineering change"
    - id: A3
      name: Compatibility judgment and consumer impact
      controlMode: engineering-decision
      rules:
        - judge the asset interface (check names / commands / directories / schema
          fields / generated structure) via the four-perspective semantics reused
          from SP-07 — no redefinition
        - compatible -> in-place upgrade path allowed; breaking -> per-consumer
          migration plan (path / deadline / support window)
        - consumer impact facts come from the registry's consumers element — a
          compatibility judgment without consumer facts is idle
    - id: A4
      name: Asset version release and controlled rollout
      controlMode: engineering-decision
      rules:
        - progressive release (opt-in -> progressive -> default for new consumers ->
          legacy migration), each step rollbackable; rollout execution control
          belongs to SP-15
        - references must pin to a committable version (@v3 / digest); uncontrolled
          @main references to multi-consumer assets are prohibited
        - "breaking changes: old version stays usable until migration completes
          (deprecation semantics reused from SP-20) — with deadline and owner"
    - id: A5
      name: Golden path regression validation
      controlMode: automation + guardrail
      rules:
        - "by asset type: template -> generate + build; reusable workflow -> real
          run on a sample repo; contract schema -> real contract validation +
          shape conformance (CLI / SDK / service faces covered); guide asset ->
          navigation resolvable (links alive, current discoverable)"
        - the pass standard is the master map §G ten questions, not author
          self-assessment; validation framework reused from SP-11 / SP-13 — this
          procedure holds the asset-specific regression list
    - id: A6
      name: Guide current surface maintenance
      controlMode: automation
      rules:
        - "after each asset version event update: valid versions, superseded
          versions (with supersession facts — successor, stop date), mirror sync
          status, registry verification time"
        - the five questions being answerable is a hard condition; when they are
          not, fix navigation before shipping new versions
    - id: A7
      name: Guide drift disposition
      controlMode: engineering-decision
      rules:
        - conflicting non-owner surfaces (stale indexes, outdated summaries,
          coexisting copies) -> register guide drift -> repair the non-owner face
          to the designated owner (no compromise, no coexistence) -> cross-part
          regression confirming no second semantics
        - "supersession follows Ch8 §58 — not \"cancelled plus a note link\": the old
          surface's authority is revoked, the successor is explicit and traceable"
    - id: A8
      name: Asset feedback loop maintenance
      controlMode: automation-assisted
      rules:
        - collect real-use evidence (golden path breakage, misfiring gates, template
          defects, obsolete spec faces) into the asset feedback backlog; signals
          enter the SP-20 maintenance-priority ledger face
        - high-value feedback converts to A2 asset changes; feedback-loop evidence
          references real work facts (GI-06), not sentiment

  gates:
    - id: G-SP22-01
      type: hard-gate
      rule: asset-modification-runs-controlled-change-loop
      note: no second "just docs / templates / scripts" path   # GI-03, P4 Ch1
    - id: G-SP22-02
      type: hard-gate
      rule: referenced-assets-require-seven-element-registration
      note: owner / version / compatibility / tests / consumers / deprecation /
            replacement-migration; unregistered assets unreferencable
            # master map §D
    - id: G-SP22-03
      type: hard-gate
      rule: asset-upgrade-requires-compatibility-and-consumer-disposition
      note: four-perspective semantics reused from SP-07; breaking asset changes
            require per-consumer migration plans
    - id: G-SP22-04
      type: hard-gate
      rule: asset-reference-pinned-and-rollout-progressive
      note: rollbackable progressive rollout; no uncontrolled @main on
            multi-consumer assets
    - id: G-SP22-05
      type: hard-gate
      rule: guide-current-surface-answers-five-questions
      note: valid sources / valid indexes / superseded / mirror sync / registry
            verification time   # P1 §10.2
    - id: G-SP22-06
      type: hard-gate
      rule: mirror-and-research-evidence-not-normative
      note: publication mirror is never a second normative source (GI-13);
            research / audit evidence is point-in-time (GI-14) — only rules
            explicitly adopted into the current baseline gain normative status
    - id: G-SP22-07
      type: hard-gate
      rule: guide-drift-registered-repaired-regressed
      note: no silent coexistence of conflicting semantics; supersession revokes
            old-surface authority with an explicit successor   # GI-12, Ch8 §58
    - id: G-SP22-08
      type: hard-gate
      rule: usability-proven-by-golden-path-regression
      note: template generate+build, workflow real-run on sample repo, schema real
            contract validation — never author self-assessment   # master map §G
    - id: G-SP22-09
      type: hard-gate
      rule: gate-zeroing-classification-requires-resolvable-rationale
      note: covers just-docs / internal-asset-nobody-uses / harmless-script-tweak /
            report-written-so-it-is-spec; re-challengeable by SP-05 / SP-13 /
            group audit   # B1

  passExit:
    equals: >
      Execution asset obligations complete (bound to the asset change): asset
      seven-element registration complete and consistent with real state + asset
      change walked the applicable SP chain (SP-03 opening -> applicable
      implementation / validation SPs -> SP-15 delivery) + compatibility judgment
      and consumer impact disposition in writing (breaking changes carry
      per-consumer migration plans with deadlines) + golden path regression
      evidence on record (actual runs against §G's ten questions) + guide
      current surface updated (incl. supersession facts) -> asset feedback
      backlog updated; consumer migration obligations handed to each consuming
      project's normal chain
    doesNotMean: [all-consumers-migrated, asset-exit-lifecycle-complete,
                  consumer-project-current-updated,
                  asset-carried-professional-semantics-revised]

  returnPaths:
    - condition: asset modification reveals a material design problem
      next: SP-05 (asset architecture / interface redesign)
    - condition: breaking change with no feasible migration path
      next: reopen version strategy (new major / dual-track transition);
            consult SP-07 migration semantics as needed
    - condition: golden path regression fails
      next: repair the asset (back to SP-06) — no shipping broken with
            "fix in the next version"
    - condition: consumer migration overdue / unowned
      next: register asset debt (SP-20 maintenance-priority face); old-version
            support windows never silently extended
    - condition: asset obsolescence traced to a downstream SP revision
      next: spec evolution input -> the corresponding SP's revision change; this
            procedure never edits professional semantics
    - condition: guide drift repair spans parts
      next: GI-12 process (resolve owner by concern + scope -> repair ->
            cross-part regression); no intra-part private settlement
    - condition: emergency asset fix (template broken on a production path)
      next: SP-21 same compressed model + mandatory reconciliation; this
            procedure invents no bypass

  exceptions:
    - id: E-single-consumer-asset
      rule: assets with exactly one consumer (team-internal scripts / single-project
            templates) may reduce rollout depth (no progressive stages, no formal
            migration plan) — but registration, change opening, and validation
            obligations are never reduced; what is tailored is the release face,
            not the governance face (GI-09). Classification carries rationale (B1)
    - id: E-supersession-transition-window
      rule: coexistence of the superseded old version with the successor during a
            transition window is legitimate — with a deadline, a migration path,
            and explicit deprecation status on the old version; new consumers go
            to the new version only. The old surface's authority is revoked when
            the supersession decision takes effect (Ch8 §58), not "kept as backup"
    - id: E-schema-freeze-form
      rule: "assets depended on by all contract projections (the operation contract
            schema, EA-18) may adopt a freeze strategy: within the freeze window
            fields are append-only (forward-compatible promise); breaking changes
            require a new apiVersion with the old version kept published. The
            freeze decision is itself an asset change, registered in the registry"
    - id: E-small-team-asset-form
      rule: "teams without a platform engineering group: the asset registry may be
            a controlled manifest file in the repository plus CODEOWNERS; the
            golden path may be one sample job in CI. The carrier is tailorable —
            the seven elements, the change model, and validation obligations are not
            (P2 Ch1 §4.3 minimum engineering requirements by analogy)"

  evidenceByWork:
    natural:
      - asset registry entries (seven elements + version events)
      - asset change records (trigger facts + impact face + modification content)
      - compatibility judgments and consumer migration plans
      - asset version release and rollout records (version pin facts)
      - guide current surface state (incl. registry verification time)
      - guide drift registration and repair records
      - golden path regression run evidence
    extraOnlyFor: [gate-zeroing-classification-rationale,
                   breaking-judgment-rationale,
                   supersession-decision,
                   migration-deadline-decision]
    rule: all other evidence emerges naturally from the work

  currentUpdateObligation:
    writesCurrent: false
    boundaries:
      - "the asset registry and guide current surface are a governance face
        independent of any project's engineering current (P1 §4.5: guide current
        surface != project engineering current), maintained directly by this
        procedure"
      - project-level current changes in consuming projects caused by asset
        changes belong to each project's own SP-19
      - revisions to normative texts (each part) go through each part's
        designated owner via revision changes

  theoryTrace:
    part1: [GI-03, GI-06, GI-11, GI-12, GI-13, GI-14, GI-17,
            p1-4.5-guide-current-surface,
            p1-10.1-asset-classes,
            p1-10.2-guide-current-surface-five-questions]
    part2: [p2-ch1-2-engineering-foundation,
            p2-ch1-4.3-minimum-engineering-requirements,
            p2-ch1-16.3-long-term-drift-protection,
            p2-ch12-maintenance-assets-as-maintained-objects]
    part3: [p3-ch5-source-build-structure,
            p3-ch8-current-structure-drift]
    part4: [ch1-change-execution-general-principles,
            ch2-establishment-baseline-binding,
            ch8-58-superseded-is-not-a-note-link,
            ch9-closure-current]
    journey: all-journeys-common   # any JG's asset feedback; the guide / asset
                                   # feedback loop closing point of the master
                                   # map's final model

  executableAssets: [EA-18, EA-19, EA-01, EA-17]
  assetRule: >
    tooling fits: asset registry maintenance, version-event records, golden path
    CI jobs, supersession status presentation, guide current surface panels.
    Tooling does not fit: compatibility / breaking judgment, supersession
    decisions, drift repair adjudication — a tool showing "latest version" is
    never the judge of "currently valid version" (GI-07). A filled template is
    never decision evidence (GI-06).

  referenceProfiles:
    - id: RP-ONLINE-API-PY-GH
      bindings:
        asset_form: reusable workflows + templates in an org/engineering repo
        version_reference: pin @v3 / immutable SHA (never @main)
        golden_path: sample repo CI matrix
        asset_registry: controlled repo manifest + CODEOWNERS
        publication_mirror: merged reading view is a mirror, never the edit entry
    - id: RP-B-CLI   # landed in group-6: 第五篇-ReferenceProfile-CLI-PythonTyper-GitHub.md
      bindings:
        asset_face: template repo / release channels / install scripts
        rollout: no server-side rollout — distribution is the release;
                 "progressive" carried by channel / cohort (same semantics as
                 SP-16 version exposure)
        breaking_migrations: heavier — distributed copies are irrevocable
    - id: RP-C-SDK   # landed in group-6: 第五篇-ReferenceProfile-SDK-PythonLibrary-GitHub.md
      bindings:
        asset_face: library templates / release process / consumer migration guide
        irrevocable: published versions cannot be recalled
        consumer_tracking: adoption observation carries migration tracking

  example:
    ref: python-ci@v3 -> v4 (org/engineering)
    continues: the version-pin fact of RP-ONLINE-API-PY-GH §12 (group-1) and the
               CHG-WO-142 project chain — work-order-service consumes the asset
               via org/engineering/.github/workflows/python-ci.yml@v3. This
               example covers the full execution-asset lifecycle
    highlight: >
      Registry state: python-ci@v3, owner = platform team, consumers = 12 repos
      (incl. work-order-service), tests = sample repo matrix, deprecation =
      unset. Trigger facts: sample job warnings on the new runner + the spec's
      migration-smoke requirement (a hypothetical SP-08 revision's semantics
      evolution input — an example setup for Trigger B's spec-evolution face,
      not current SP-08 content) —
      asset obsolescence established. Asset change AST-CHG-014 opened via SP-03,
      scope = the asset itself + 12 consumers' migration obligations; B1
      re-challenge of "just a workflow tweak" fails — 12 repos' CI depends on
      this asset's interface. Compatibility judgment: interface = check name
      `verify` (unchanged) + a new opt-in migration-smoke step — judged
      compatible-plus-optional-enhancement, not breaking; a future check-name
      change would be breaking with per-consumer migration. Release: v4
      published, v3 enters deprecation (6-month window, SP-20 semantics);
      rollout = workflow_dispatch opt-in -> progressive migration -> default for
      new repos, execution control in SP-15; v3 stays usable without fixes
      through the window. Golden path: v4 real-run on the sample matrix
      (generate -> verify -> migration smoke -> build), §G's ten questions
      checked — findable (EA-01), check name stable, gates really block (an
      intentionally failing branch is blocked). Guide current surface: python-ci
      valid = v4; v3 = superseded (successor = v4, stop date +6 months); org
      portal asset page synced (mirror sync checked); registry verification time
      recorded. Drift: two repos still run privately-forked python-ci-old copies
      — registered as guide drift (conflicting non-owner surface for the same
      concern), repaired by pointing back to the org asset with private steps
      proposed as parameters; no compromise coexistence. Feedback loop: 3 repos
      stuck on self-hosted runner differences -> asset backlog, scheduled as
      v4.1 (parameterized runner support); the uncovered golden path face
      (self-hosted) added to the matrix.
