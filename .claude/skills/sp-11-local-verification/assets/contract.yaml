# SP-11 Local Verification — Operation Contract
# Machine-loadable mirror of 第五篇-SP11-LocalVerification-正式操作规程.md
# The Markdown body is the normative source; this contract is its structured projection
# for harness execution (park-smart-harness). Semantics must not diverge: if they do,
# repair the projection, never the reverse (GI-13).
apiVersion: spec.part5/v1alpha1
kind: OperationContract
metadata:
  id: SP-11
  name: Local Verification
  status: sealed                   # 2026-08-31 group-3 audit PASS AFTER REPAIR + regression 1050 citations VERIFIED (2 note-level repairs)
  version: 1.0.0
  normativeSource: 第五篇-SP11-LocalVerification-正式操作规程.md
  singleResponsibility: >
    Produce revision-bound, trustworthy, classified Local Evidence for an explicit
    Implementation Revision / Revision Set: compose and run Feedback Runs in the
    local / pre-submit scopes, bind them to their real context, judge applicability
    and invalidation, dispose unreliable feedback and required feedback evidence
    gaps, classify every failure to the correct return layer, retain evidence by
    diagnostic value, and hand off truthfully. This procedure is the specialized
    detail behind SP-06 A6-A8; feedback green is not required verification complete,
    and local evidence is not candidate membership.

spec:

  triggers:
    - id: T-local-implementation-change        # edit -> build/check/test loop
    - id: T-pre-submit                         # before review / shared integration
    - id: T-binding-context-change             # head / base / dependency / test-definition change
    - id: T-required-feedback-missing          # flaky / quarantine / skipped / tool failure / context mismatch
    - id: T-feedback-fail                      # classify before acting
  boundaryRule: >
    Never re-decides candidate formation, required verification sufficiency,
    acceptance (SP-13), review approval or integration entry (SP-12), canonical
    build / provenance (SP-14), target validation (SP-17), or any current update
    (SP-19). A check not reliably executed is not evidence pass; platform UI
    showing skipped as success changes nothing.

  inputs:
    required:
      - name: implementation_revision_or_set
        type: ref
        rule: uniquely resolvable; multi-repo / multi-build-unit binds one explainable revision set
      - name: working_source_base_context
        type: reference-set                 # from SP-06 A1/A3
      - name: verification_related_guardrails
        type: ref                           # from SP-06 A2 guardrail set
      - name: required_local_feedback_obligation_sources
        type: reference-set
        members: [policy-gate-declarations, design-verification-obligations,
                  candidate-acceptance-expectations, direct-regression-protection]
      - name: feedback_mechanisms
        type: asset-refs                    # EA-04 / EA-07 / EA-08
      - name: historical_feedback_bindings
        type: record-set                    # for reuse / rerun judgement
    upstreamRechallenge: >
      Gate-zeroing dispositions inherited from SP-06 (no-known-blocker claims,
      optional classifications, delegated obligations) must carry resolvable
      rationale / evidence pointers; ungrounded ones are challenged back to the
      source procedure, never silently inherited (B1 rule).

  outputs:
    primary:
      kind: LocalEvidenceBundle
      fields:
        - name: local_evidence_set
          rule: one feedback binding per run; state in [satisfied, failed, unreliable, gap]
        - name: finding_register
          rule: classification + return path + disposition per finding
        - name: evidence_gap_records
          rule: gap + one of [alternative-evidence, controlled-exception, decision-blocked]
        - name: quarantine_records
          fields: [owner, reason, follow-up]
        - name: pre_submit_readiness_fact
          rule: >
            scope-bound three-state, consumed by SP-12 — READY (all pre-submit
            obligations satisfied, incl. via alternative evidence) /
            READY-WITH-EXCEPTION (gaps disposed via controlled exception travel
            visibly with the handoff) / NOT_READY (a gap disposed as
            decision-blocked exists)
    nonOutputs:
      - candidate-baseline-or-membership       # SP-13; artifact selection is explicit
      - required-verification-satisfied        # SP-13
      - candidate-accepted                     # SP-13
      - review-approval-or-integration-decision # SP-12
      - any-current-update                     # SP-19; merge / green never update current

  invariants:
    - id: check-not-reliably-executed-is-not-pass
    - id: green-is-not-a-permanent-fact
    - id: feedback-build-not-candidate-build-not-release-build
    - id: change-local-test-not-required-verification-set
    - id: failure-not-implementation-defect-by-default
    - id: quarantine-is-never-free               # owner + reason + follow-up
    - id: four-scopes-not-four-mandatory-stages

  actions:
    - id: A1
      name: Resolve required local feedback obligation set
      controlMode: engineering-decision
      rules:
        - resolve from policy / gate declarations, design verification obligations,
          candidate acceptance expectations, direct regression protection
        - every obligation labeled required / optional with rationale and source pointer
        - re-challenge upstream gate-zeroing dispositions (B1)
    - id: A2
      name: Compose feedback runs
      controlMode: engineering-decision + automation
      features: [revision-bound, fast-enough, repeatable-enough, diagnostic-enough]
      rules:
        - fast / repeatable / diagnostic enough are project-context judgements, not fixed minutes
        - mechanisms failing repeatable / diagnostic enough go to A6 before producing results
        - static check registered apart from dynamic test; change-local test registers
          its protection boundary and never claims coverage of cross-service integration /
          performance / security / acceptance / target validation
    - id: A3
      name: Execute and bind
      controlMode: automation
      minimumBinding:                          # P4 Ch5 §81
        - subject-revision / revision-set
        - base / integration-context (when applicable)
        - check / test-identity
        - result
        - relevant dependency / build-context (risk-scaled)
        - observed-at
      rules:
        - binding is produced at run time, never backfilled
        - unbound or unresolvable runs record GAP, not SATISFIED
        - temporary-environment / non-retained feedback builds are legal but their
          artifacts must not later claim candidate eligibility
    - id: A4
      name: Judge run result state
      controlMode: guardrail
      vocabulary:
        satisfied: trustworthy execution + complete binding + pass
        failed: trustworthy execution + complete binding + fail   # -> A8
        unreliable: mechanism not trustworthy                     # -> A6
        gap: required feedback without trustworthy execution      # -> A7
      rules:
        - tool exit code success / platform green / skipped-but-success are not
          sufficient for satisfied
    - id: A5
      name: Re-judge applicability of prior results
      controlMode: engineering-decision          # automation challenges; conclusions stay human
      invalidators: [head-revision-change, base-revision-change,
                     dependency-context-change, test-definition-change]
      dispositions: [rerun, reuse, not-applicable]
      rules:
        - default action is rerun
        - reuse must record why old evidence still covers the new revision
        - "not-applicable is a gate-zeroing disposition: rationale recorded, re-challengeable
          at SP-12 / SP-13 entry (B1)"
        - review approval invalidates on material revision change (SP-12 executes re-review)
    - id: A6
      name: Dispose unreliable feedback
      controlMode: engineering-decision
      rules:
        - no rerun-until-green; the first FAIL record is never auto-deleted
        - classify the failure type first (product / test / environment / concurrency /
          infra / external / unknown)
        - fix the mechanism (test / check defect path) or quarantine
        - quarantine carries owner + reason + follow-up; a quarantined required check
          immediately forms an evidence gap (A7)
        - chronically flaky mechanisms are process signals, never personnel KPIs
    - id: A7
      name: Dispose required feedback evidence gaps
      controlMode: engineering-decision + authority
      dispositions:
        - alternative-evidence                 # equivalence rationale required;
                                               # obligation satisfied, never blocks
        - controlled-exception                 # scope + deadline + approver;
                                               # handoff allowed, exception travels visibly
        - decision-blocked                     # downstream decisions depending on it halt;
                                               # readiness fact = NOT_READY
      rules:
        - gap records travel with the evidence bundle; re-challengeable at SP-12 / SP-13 entry
        - optional local feedback may be skipped; required-role checks never
    - id: A8
      name: Classify every finding and route the return layer
      controlMode: engineering-decision
      vocabulary:                              # P4 Ch5 §100-108
        implementation-defect: fix in layer (SP-06 rework, new revision)
        test-check-defect: fix the test/check; never bend product code for green
        design-assumption-invalidated: return to SP-05
        new-impact-discovery: return to SP-04
        requirement-semantic-gap: return to requirement authority, then SP-04 / SP-05 as applicable
        integration-conflict-context-change: context reconciliation (SP-12 domain) + re-evaluate as needed
        tool-infrastructure-failure: fix feedback infrastructure; never revert product for infra failure
        external-environment-dependency: isolate external cause; record GAP / NOT_READY, not product FAIL
        unknown: retain unknown and collect evidence; never force-classify
    - id: A9
      name: Retain evidence by diagnostic value
      controlMode: guardrail + policy
      retainLongTerm: [design-impact-decision-change, shared-baseline-breakage,
                       required-gate-review-failure, material-security-data-finding,
                       accepted-exception-bypass, persistent-repeated-failure,
                       root-cause-with-future-value]
      rules:
        - local noise (compile typo, instantly fixed unit fail) not mandated for archive
        - small changes may use VCS / PR / CI as the evidence carrier directly
    - id: A10
      name: Hand off local evidence
      controlMode: automation + guardrail      # incomplete bundles do not ship
      handoffs:
        - to: SP-06
          carries: feedback state feeding the outputs-ready no-known-blocker condition
        - to: SP-12
          carries: pre-submit readiness fact (scope-bound three-state); NOT_READY
                   never hands off; READY-WITH-EXCEPTION hands off with the
                   exception travelling visibly
        - to: SP-13
          carries: full local evidence set; artifacts with identity / traceable inputs /
                   stable context are selectable by Ch6 — selection is SP-13's decision
      rules:
        - handoff is never candidate accepted, never required verification complete,
          never a current update

  gates:
    - id: G-SP11-01
      type: hard-gate
      rule: no-old-green-for-new-revision      # head/base/dependency/test-definition change forces re-judgement
    - id: G-SP11-02
      type: hard-gate
      rule: no-rerun-until-green
    - id: G-SP11-03
      type: hard-gate
      rule: no-silent-quarantine-or-skip-of-required-evidence
    - id: G-SP11-04
      type: hard-gate
      rule: feedback-success-is-not-candidate-accepted-verification-complete-or-release-ready
    - id: G-SP11-05
      type: hard-gate
      rule: no-unclassified-failure-attribution
    - id: G-SP11-06
      type: hard-gate
      rule: static-check-is-not-dynamic-test; change-local-test-is-not-required-verification-set
    - id: G-SP11-07
      type: hard-gate
      rule: no-implicit-candidate-membership-of-feedback-artifacts
    - id: G-SP11-08
      type: hard-gate
      rule: material-feedback-bound-at-runtime
    - id: G-SP11-09
      type: hard-gate
      rule: reuse-and-not-applicable-require-resolvable-rationale
    - id: G-SP11-10
      type: hard-gate
      rule: required-evidence-gap-requires-explicit-disposition

  passExit:
    equals: local-evidence-state-truthfully-established
    minimumConditions:
      - every required obligation has a final state (satisfied / failed-classified-routed /
        gap-disposed / not-applicable-with-rationale)
      - every satisfied result fully bound and applicable to the current revision
        (or reuse rationale recorded)
      - no undisposed required gap, no bare quarantine, no rerun-until-green residue
      - no unrouted FAILED in the finding register
      - handoff bundle emitted (obligation states + gaps + quarantines + exceptions + reuse basis)
    notReadyIsTruthful: >
      Gaps route by disposition: alternative-evidence satisfies the obligation and
      never blocks; controlled-exception hands off as READY-WITH-EXCEPTION with the
      exception visible; decision-blocked makes the conclusion NOT_READY for
      downstream decision and dependent downstream actions stay blocked.
      Truthful, not a failure.
    doesNotMean: [candidate-formed, required-verification-satisfied, review-passed,
                  shared-baseline-entry, any-current-updated]

  returnPaths:
    - condition: implementation defect
      next: SP-06 in-layer rework, new revision
    - condition: test / check defect
      next: fix the feedback mechanism; product code untouched
    - condition: design assumption invalidated
      next: SP-05
    - condition: new impact discovery
      next: SP-04
    - condition: requirement semantic gap
      next: requirement authority, then SP-04 / SP-05 as applicable
    - condition: integration conflict / context change
      next: SP-12 context reconciliation; re-evaluate as needed
    - condition: tool / infrastructure failure
      next: fix feedback infrastructure; never revert product
    - condition: external environment / dependency failure
      next: isolate external cause; gap / not-ready, not product fail
    - condition: unknown failure
      next: retain unknown, collect evidence
    - condition: cannot continue locally (external dependency / missing decision)
      next: work-package blocker via SP-06; not change BLOCKED

  exceptions:
    - id: E-emergency
      rule: feedback breadth compressible under Ch8 fast-path; classification, binding
            and gap disposition never waived; compression scope recorded; post-change
            verification mandatory; reconciled afterwards via SP-21 / SP-19
    - id: E-small-change
      rule: VCS / PR / CI directly carry evidence; obligation set folds into the PR
            description; semantic items (binding, classification, gap disposition)
            never skipped
    - id: E-optional-skip
      rule: correctly classified optional local feedback may be skipped; the optional
            classification itself is a gate-zeroing disposition — rationale recorded,
            re-challengeable downstream
    - id: E-controlled-quarantine
      rule: quarantine legal with owner + reason + follow-up; required items
            simultaneously form an evidence gap disposed per A7; overdue follow-up
            escalates to a finding

  evidenceByWork:
    natural:
      - VCS / PR / CI run records with runtime-produced bindings
      - task runner output
    extraOnlyFor: [obligation-set-with-sources, reuse-not-applicable-rationale,
                   quarantine-record, evidence-gap-disposition, retained-finding-classification]
    rule: retention by diagnostic value; full retention not mandated; backfilled
          bindings are not evidence

  currentUpdateObligation:
    writesCurrent: false
    note: >
      Local verification never updates any current. Feedback green, pre-submit
      readiness, even later merge / integration, do not constitute current updates;
      SP-19 (formal candidate within this group) is the sole calibration / commit
      channel. Local evidence produced here is a candidate Actual Evidence Ref for
      SP-19 calibration.

  theoryTrace:
    part1: [GI-03, GI-05, GI-13]
    part2: [testing-quality-what, build-what, evidence-semantics]
    part3: [source-runtime-as-evidence-context, source-where-resolvable]
    part4: [ch5-feedback-loop-binding-classification, ch5-rework-evidence-retention,
            ch5-minimum-requirements-274-279-287-299-303-305,
            ch6-evidence-semantics-producer-side, ch8-emergency-compression]

  executableAssets: [EA-04, EA-07, EA-08, EA-03]
  assetRule: >
    Tooling fits: running feedback, producing bindings at run time, applicability
    challenges, record retention. Tooling does not fit: finding classification,
    reuse rationale, gap disposition, exception approval.

  referenceProfiles:
    - id: generic-layer
      bindings:
        applies: all profiles share operation contract / theory trace / evidence / control semantics
    - id: risk-overlay
      bindings:
        rule: overlay decides required local feedback depth; reductions registered with rationale
        note: concrete profile mappings are registered when group-6 lands RPs; no placeholder rows

  example:
    ref: CHG-WO-142-WP1
    continues: SP-06 example (WP-1 data expand)
    highlight: >
      Obligation set resolves 4 required checks (migration smoke from design,
      module unit tests from policy, focused contract check from candidate
      expectations, lint) and 2 optional (benchmark, docs link). Round one:
      migration smoke FAIL on WP-1@R1, classified implementation defect — design
      still correct, fixed in-layer at R2. Round two: old ORM cannot read the new
      column — classified design-assumption-invalidated, returned to SP-05 (and
      SP-04 when the affected runtime range proved wider). A flaky focused
      contract check (fail-rerun-pass) keeps its first FAIL record, is judged an
      order-dependent test defect, quarantined with owner/reason/follow-up; being
      required, it forms an evidence gap disposed via deterministic local reruns
      as alternative evidence. Handoff: 4 satisfied (1 via alternative evidence),
      1 disposed gap, 1 quarantine, 2 routed findings — a truthful local evidence
      state, not candidate acceptance.
