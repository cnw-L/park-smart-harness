# SP-12 Review / Shared Integration — Operation Contract
# Machine-loadable mirror of 第五篇-SP12-ReviewSharedIntegration-正式操作规程.md
# The Markdown body is the normative source; this contract is its structured projection
# for harness execution (harness-agnostic). Semantics must not diverge: if they do,
# repair the projection, never the reverse (GI-13).
apiVersion: spec.part5/v1alpha1
kind: OperationContract
metadata:
  id: SP-12
  name: Review / Shared Integration
  status: sealed                   # 2026-08-31 group-3 audit PASS AFTER REPAIR + regression 1050 citations VERIFIED (2 note-level repairs)
  version: 1.0.0
  normativeSource: 第五篇-SP12-ReviewSharedIntegration-正式操作规程.md
  singleResponsibility: >
    Move a review-ready Implementation Unit into the Shared Integration Baseline
    under control: run revision-bound work product review, obtain integration-context
    feedback against a fresh-enough context, integrate incomplete features via
    controlled mechanisms, classify and restore shared baseline breakage with an
    owner, and emit truthful integration evidence. This is the specialized detail
    behind SP-06 A10; generic feedback run / binding / classification mechanics are
    reused from SP-11. Review is feedback, not required verification; integration
    is neither deployment nor release; merge never updates any current.

spec:

  triggers:
    - id: T-review-ready                        # unit meets review-ready candidate conditions
    - id: T-integration-entry                   # review passed / waived, entering shared baseline
    - id: T-concurrent-material-boundary-change # need fresh-enough integration-context feedback
    - id: T-suspected-shared-baseline-breakage
    - id: T-review-finding-or-integration-failure
  boundaryRule: >
    Never produces candidate acceptance (SP-13), release / supported status (SP-15),
    target environment actions (SP-15 / SP-17), deviation / drift disposition or
    outputs-ready judgement (SP-06), or any current update (SP-19). Breakage is a
    scoped baseline condition / finding, never a change state.

  inputs:
    required:
      - name: review_ready_implementation_unit
        type: ref
        rule: revision resolvable; SP-11 pre-submit readiness fact + local evidence bundle received
      - name: review_object_set
        type: scope
        members: [source, migration, contract-definition, config, generated-change,
                  test, build-definition]      # by applicability, P4 Ch5 §154
      - name: reviewer_selection_basis
        type: policy                          # ownership / risk / policy / specialist concern
      - name: integration_context_definition
        type: config                        # trunk / integration branch / protected merge result / merge queue
        members: [context-form, context-freshness-policy]
                                            # freshness policy = change rate / risk / queue / build cost (§186/§295)
      - name: concurrent_change_landscape
        type: record-set                    # in-flight changes touching same material boundaries
    optional:
      - name: incomplete_feature_mechanism
        type: ref                           # flag / inactive path / branch-by-abstraction /
                                            # backward-compatible contract / internal-only slice
        rule: must trace to Ch4 transition / cleanup design
    upstreamRechallenge: >
      Gate-zeroing dispositions in the SP-11 handoff (optional classifications,
      reuse rationale, not-applicable claims, quarantine / gap dispositions) must
      carry resolvable rationale; ungrounded ones return to SP-11 (B1 rule).

  outputs:
    primary:
      kind: ReviewIntegrationBundle
      fields:
        - name: review_record
          rule: approval / finding bound to an explicit revision; findings classified + routed
        - name: integration_record
          rule: unit + integration context + result; merge result bound when used as feedback subject
        - name: integration_evidence
          rule: feedback bound to integration context; consumed by SP-13
        - name: shared_baseline_health_fact
          rule: buildable / testable / integrable / traceable state; breakage records
                carry classification + owner + restore path
    nonOutputs:
      - candidate-accepted-or-verification-satisfied   # SP-13
      - release-or-supported-status                    # SP-15
      - accepted-current-release                       # SP-15 / SP-17
      - any-current-update                             # SP-19
      - change-state-transitions                       # breakage is not a change state

  invariants:
    - id: review-is-feedback-not-verification
    - id: approval-binds-revision
    - id: integration-not-deployment-not-release
    - id: shared-baseline-not-accepted-current-release
    - id: merge-never-updates-current
    - id: breakage-is-not-a-change-state
    - id: restore-first-but-restore-not-mechanical-revert
    - id: incomplete-feature-is-not-an-excuse-for-broken-baseline

  actions:
    - id: A1
      name: Verify review-ready
      controlMode: guardrail
      minimumCandidateConditions:              # P4 Ch5 §156
        - build / run works (when applicable)
        - change-local test passes
        - static check has no known blocker
        - contract / migration / config synchronized
        - no obvious secret / debug artifact
        - description explains why
        - design / work-package trace resolvable
      rules:
        - any miss returns to SP-11 / SP-06 with the gap list
        - re-challenge upstream gate-zeroing dispositions (B1)
    - id: A2
      name: Compose the review
      controlMode: engineering-decision + policy
      rules:
        - review objects span more than code, by applicability
        - reviewer count not fixed; driven by ownership / risk / policy / specialist concern
        - high-risk surfaces (contract semantics, data migration, security) require the
          corresponding specialist view; absence registered with rationale
        - reviewers receive why + design trace + SP-11 evidence bundle
    - id: A3
      name: Run revision-bound review
      controlMode: human-judgment              # tools present evidence, never approve
      rules:
        - active reasoning required; CI green does not replace judgement
          (concurrency / boundary / semantic compatibility / complexity)
        - findings classified via the SP-11 nine-class vocabulary and routed
        - approval binds an explicit revision; material new revision re-judges applicability
        - minor-revision re-review decided by policy / materiality; the minor/material
          split records rationale and is re-challengeable by SP-13
    - id: A4
      name: Judge integration path and context freshness
      controlMode: engineering-decision
      rules:
        - latest-main per PR not mandated; freshness driven by change rate / risk /
          merge queue / build cost
        - known concurrent change on the same material boundary forces advancing the
          context and re-obtaining integration-context feedback
        - freshness rationale written into the integration record
    - id: A5
      name: Integrate and obtain integration-context feedback
      controlMode: automation + sp11-mechanics
      rules:
        - feedback binds the merge result (synthetic merge / queue result), not only
          the branch head
        - binding / invalidation / unreliable / gap mechanics reused from SP-11
        - "concurrent interaction checklist: contract conflict, dependency conflict,
          data migration order, generated artifact conflict, behavior interaction"
    - id: A6
      name: Integrate incomplete features safely
      controlMode: engineering-decision + guardrail
      rules:
        - "controlled mechanism required: old behavior preserved, new path inactive,
          schema / contract compatible, shared checks green"
        - feature flags trace to Ch4 transition / cleanup design (exit semantics + owner);
          merge-easy permanent flags rejected back to SP-05 / SP-06
        - long-lived divergence recorded and pushed toward slicing
    - id: A7
      name: Enter the shared baseline
      controlMode: automation + guardrail
      rules:
        - verify buildable / testable / integrable / traceable on the integration context
        - entry is an integration record fact; it updates no current — project-defined
          development-current advancement goes through explicit baseline transition
          records via SP-19
    - id: A8
      name: Monitor and dispose shared baseline breakage
      controlMode: engineering-decision + guardrail
      sequence:
        - qualify against critical shared capability; arbitrary warnings are not breakage
        - record breakage as scoped baseline condition / finding; never a change state
        - classify source: current change / concurrent change / test / dependency / infrastructure
        - assign an owner
        - "restore first: fix-forward / revert / disable / restore-dependency /
          repair-test-infra chosen by classification"
        - judge relation to change execution condition independently; blocker /
          BLOCKED rules apply only when no executable path remains
        - block stacking new changes on an unrestored broken baseline
      rules:
        - product defect may be reverted; infrastructure failure must not revert product;
          broken tests are fixed at the test, never by deleting correct product behavior
    - id: A9
      name: Classify integration failures
      controlMode: engineering-decision
      vocabulary: [merge-conflict, build-fail, test-fail, dependency-fail, infra-fail]
      rule: map to the SP-11 nine classes and route; merge conflict is integration
            conflict / context change, not a product defect
    - id: A10
      name: Hand off integration evidence
      controlMode: automation + guardrail
      handoffs:
        - to: SP-13
          carries: integration record, merge-result-bound feedback, breakage history,
                   revision-bound review record
        - to: SP-06
          carries: review / integration state facts for outputs-ready judgement
      rule: integration green means the candidate has real feedback against the current
            development context — never candidate accepted

  gates:
    - id: G-SP12-01
      type: hard-gate
      rule: review-never-substitutes-dynamic-testing-or-required-verification
    - id: G-SP12-02
      type: hard-gate
      rule: review-approval-binds-revision; material-new-revision-rejudges
    - id: G-SP12-03
      type: hard-gate
      rule: no-fixed-reviewer-count
    - id: G-SP12-04
      type: hard-gate
      rule: critical-breakage-restore-first; restore-not-mechanical-revert
    - id: G-SP12-05
      type: hard-gate
      rule: feature-incomplete-is-no-excuse-for-broken-shared-baseline
    - id: G-SP12-06
      type: hard-gate
      rule: same-material-boundary-concurrency-requires-fresh-integration-feedback
    - id: G-SP12-07
      type: hard-gate
      rule: merge-integration-never-updates-current        # GI-05
    - id: G-SP12-08
      type: hard-gate
      rule: breakage-never-becomes-a-change-state
    - id: G-SP12-09
      type: hard-gate
      rule: no-product-revert-for-infra-failure; no-product-deletion-for-broken-test
    - id: G-SP12-10
      type: hard-gate
      rule: zeroing-judgements-carry-rationale-and-stay-rechallengeable   # B1

  passExit:
    equals: unit-integrated-with-truthful-evidence
    minimumConditions:
      - review record bound to current revision (or applicability re-judged)
      - all review findings classified and routed; no open change-requests
      - integration record exists; feedback valid on a fresh-enough context
      - incomplete features integrated via controlled mechanisms with Ch4-traceable flags
      - no known critical breakage, or breakage has owner + restore path and its
        relation to the change's execution condition is explicitly judged
      - integration evidence handed to SP-13; state facts returned to SP-06
    doesNotMean: [candidate-accepted, release-established, any-current-updated, change-done]

  returnPaths:
    - condition: review finding
      next: SP-11 nine-class routing (in-layer / SP-05 / SP-04 / requirement authority)
    - condition: material new revision
      next: re-judge approval applicability; re-review per policy / materiality
    - condition: integration failure
      next: classify — conflict -> context reconciliation; build/test -> SP-11 mechanics;
            dependency -> SP-09 domain; infra -> fix infrastructure
    - condition: shared baseline breakage
      next: A8 sequence (classify -> owner -> restore first)
    - condition: material base change
      next: re-obtain integration-context feedback; re-evaluate SP-04 / SP-05 as needed

  exceptions:
    - id: E-minor-revision
      rule: typo-level changes may skip full re-review per policy; rationale recorded
            and re-challengeable; contract / data / security semantics are never minor
    - id: E-small-change
      rule: review-ready check, review record and integration record fold into one PR
            flow; semantic items never skipped
    - id: E-emergency
      rule: review breadth and integration wait compressible under Ch8 fast-path;
            revision-bound approval, breakage disposition and current red lines never
            waived; reconciled afterwards via SP-21 / SP-19
    - id: E-merge-queue
      rule: merge queue / protected merge result forms are equivalent and legal;
            feedback must bind the merge result, and the breakage owner institution
            survives automation

  evidenceByWork:
    natural:
      - PR / CL platform records (review, approvals)
      - merge queue / CI records bound to merge results
      - repository rules enforcement logs
    extraOnlyFor: [reviewer-composition-rationale, minor-material-split-rationale,
                   context-freshness-rationale, breakage-record, flag-ch4-trace]
    rule: small changes use the platform as carrier; semantic records never waived

  currentUpdateObligation:
    writesCurrent: false
    note: >
      Merge / integration changes only the source fact. Project-defined development
      current advancement requires an explicit baseline transition rule / record,
      executed via the SP-19 channel. Shared integration baseline state is a
      baseline health fact, not an accepted current release.

  theoryTrace:
    part1: [GI-03, GI-05, GI-13]
    part2: [implementation-review-quality-what, build-what]
    part3: [source-build-where, shared-baseline-as-structural-fact]
    part4: [ch5-review-integration-shared-baseline-153-194,
            ch5-minimum-requirements-288-295-298-300-305,
            ch5-feedback-mechanics-via-sp11, ch5-consumer-interface-toward-ch6-193-194,
            ch8-emergency]

  executableAssets: [EA-05, EA-06, EA-07, EA-08]
  assetRule: >
    Tooling fits: executing integration, binding merge results, enforcing required
    checks, surfacing concurrency. Tooling does not fit: review approval, finding
    classification, freshness judgement, breakage qualification and restore choice.

  referenceProfiles:
    - id: generic-layer
      bindings:
        applies: all profiles share operation contract / theory trace / evidence / control semantics
    - id: delivery-shape
      bindings:
        rule: shape decides shared baseline form and integration feedback composition
              (e.g. CLI / SDK downstream compatibility matrix CI; absent runtime
              feedback explicitly declared)
    - id: risk-overlay
      bindings:
        rule: overlay decides reviewer composition, freshness strictness, breakage
              qualification threshold; concrete profile mappings registered in group-6

  example:
    ref: CHG-WO-142-WP1-WP2
    continues: SP-11 example (WP-1 reworked from R2 via SP-05 round-trip to R4)
    highlight: >
      Review on WP-1 R4 finds the real transition needs new-provider + old-consumer
      coverage while change-local tests cover only new + new; since the design never
      defined mixed-version semantics, the finding returns to SP-05, a new design
      revision lands, and WP-1 reaches R5 with approval re-bound (R4 approval does
      not carry over). A colleague's WP-2 touching the same contract package is a
      material base change: the integration context advances to synthetic merge M1
      and status checks bind M1, surfacing a contract serialization conflict routed
      to context reconciliation. After WP-2 merges, the shared contract build goes
      red: qualified as breakage (never a change state), classified before action —
      product source defect gets fix-forward-or-revert with restore priority, while
      a CI runner failure would repair infrastructure without reverting product.
      WP-3's unfinished search enhancement integrates behind a Ch4-traceable feature
      flag with old behavior preserved and shared checks green. Handoff to SP-13:
      R5-bound review record, M1-bound integration record, one disposed breakage
      record (classification branch settled by actual qualification, with owner /
      restore result) — integration green, candidate acceptance still SP-13's call.
