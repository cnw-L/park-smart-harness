# SP-08 Data / Migration Evolution & Controlled Execution — Operation Contract
# Machine-loadable mirror of 第五篇-SP08-DataMigrationEvolution-正式操作规程.md
# The Markdown body is the normative source; this contract is its structured projection
# for harness execution (park-smart-harness). Semantics must not diverge: if they do,
# repair the projection, never the reverse (GI-13).
apiVersion: spec.part5/v1alpha1
kind: OperationContract
metadata:
  id: SP-08
  name: Data / Migration Evolution & Controlled Execution
  status: sealed                   # 2026-09-01 group-4 audit PASS AFTER REPAIR + regression 1712 citations PASS AFTER REPAIR (REPAIR-1 applied)
  version: 1.0.0
  normativeSource: 第五篇-SP08-DataMigrationEvolution-正式操作规程.md
  singleResponsibility: >
    Run the professional evolution and controlled execution of a change touching
    persisted data (schema / representation / reference data / change-driven
    transformation / backfill / production data fix): establish data meaning and
    ownership facts, design Current -> Target (via Transition when needed)
    evolution, manage versioned migration / backfill with execution control,
    define compatibility combinations and recovery, and organize verification.
    Code can be redeployed; produced data cannot simply be regenerated.
    Migration success (no error) != data change correctly completed;
    rollback != recovery.

spec:

  triggers:
    - id: T-change-touches-persisted-data        # via SP-04 data/migration impact (JG-04)
    - id: T-schema-constraint-index-reference-data-evolution   # §16-17, §41
    - id: T-transformation-backfill-production-fix # §17, §25-27, §42
    - id: T-data-side-compatibility-evolution    # multi-version coexistence / dual
                                                 # read-write / retention change (§28-31, §48)
  redLine: >
    A high-risk data change must never execute without a recovery design
    (§65.5 [MUST][BASELINE]): how to actually recover after failure must have an
    answer first — not merely whether a down.sql exists (§33).

  inputs:
    required:
      - name: data_migration_impact_conclusion
        type: ref                     # SP-04: which persisted data / schema /
                                      # consumers / depth / irreversibility
      - name: current_data_baseline
        type: reference-set           # model/shape, schema version, ownership/
                                      # authority, constraint, migration state,
                                      # supported release compatibility — with
                                      # environment/baseline scope (§59-60)
      - name: data_semantics_ownership_facts
        type: reference-set           # meaning / owner / write authority /
                                      # invariant / authoritative source /
                                      # derived relations (§4-8)
      - name: migration_asset_state
        type: reference-set           # applied migration state per environment
                                      # (id / applied time / result / schema state, §18-19)
      - name: release_path_facts
        type: reference-set           # rolling / multi-version / maintenance window /
                                      # zero-downtime requirement source (§28, §55-56)
    conditional:
      - name: existing_data_facts
        type: list<evidence-ref>      # volume / distribution / invalid values /
                                      # historical semantics (§25, §35, §65.3)
        appliesWhen: change touches existing rows

  outputs:
    primary:
      - name: data_evolution_record
        fields: [meaning, owner, write-authority, invariant, authoritative-source,
                 derived-positioning, null-default-semantics, identifier-stability,
                 time-unit-encoding]   # §8, §12-15
      - name: schema_evolution_design
        rule: current / target / (transition) distinguished (§20); additive vs
              destructive explicitly recognized (§22-23)
      - name: migration_backfill_plan
        rule: versioned migration artifact (identity / dependency / order, §16-18);
              backfill decision (allow-null / derive / default / manual-fix /
              unrecoverable list, §25); large backfill batch / rate /
              pause-resume / observability design (§27, §53-54)
      - name: compatibility_plan
        rule: version combinations on the real release path defined (§28, §65.4);
              decoupling from application release (§55)
      - name: transition_mechanism_design
        rule: EMC phase plan / dual read-write with owner + exit condition +
              verification + cleanup + conflict source-of-truth (§29-31)
      - name: recovery_design
        rule: forward-fix / restore / compensation / repair / disable-feature /
              replay-event, one or combined (§33); restart/recovery for long
              migrations (§34)
      - name: verification_plan
        rule: precondition / postcondition / independent verification means
              (§35-37); production-like data for high risk (§52)
      - name: migration_evidence
        fields: [artifact, migration-id, review, execution-result, environment,
                 start-end, validation-result, backfill-result, error-retry,
                 recovery-record]   # §62
    nonOutputs:
      - data-exchange-contract-evolution     # SP-07
      - code-implementation                  # SP-06
      - verification-verdicts                # SP-11 / SP-12 / SP-13
      - release-deployment-facts             # SP-15 / SP-17
      - current-data-baseline-updates        # SP-19 (§61)
      - standing-data-quality-governance     # runtime governance; this procedure
                                             # only owns verifiable requirements (§40)

  invariants:
    - id: code-redeployable-data-not-regenerable
    - id: migration-success-not-change-correct
    - id: rollback-not-recovery
    - id: schemaless-not-evolution-less
    - id: additive-not-zero-risk
    - id: target-never-masquerades-as-current
    - id: dual-write-not-default
    - id: backup-not-recovery

  actions:
    - id: A1
      name: Confirm entry and data touch surface
      controlMode: automation-assisted
      rules:
        - locate the change on the data chain (§3); enumerate touched persisted
          surfaces (schema / constraint / index / reference data / transformation /
          backfill / production fix, §17, §41-42)
        - "B1 re-challenge: upstream no-data-impact / additive-zero-risk /
          low-risk-pure-DDL classifications without resolvable rationale return
          to SP-04"
    - id: A2
      name: Establish data meaning and ownership facts
      controlMode: engineering-decision
      rules:
        - "per surface (§65.1 [MUST][BASELINE]): meaning / owner / write authority /
          invariant; authoritative source and derived positioning (§6-7);
          null / default semantics (§12-13); identifier stability (§14);
          time / unit / encoding (§15)"
        - semantic gaps or unclear owner are filled before evolution design;
          never design migration on semantic void
    - id: A3
      name: Define Current / Target / Transition
      controlMode: engineering-decision
      rules:
        - start from scoped current data baseline (§59-60); define target; define
          transition schema when non-atomic compatibility needed (§20)
        - "explicitly recognize additive / destructive (§22-23); destructive answers
          five questions: old app? old data? consumer reads? rollback? backup?"
        - identify direct readers / shared database risk (§44-45)
    - id: A4
      name: Design migration / backfill
      controlMode: engineering-decision
      rules:
        - versioned migration artifact with identity / dependency / order
          (§16-18, §65.2 [MUST][BASELINE]); externally-controlled schema at least
          versions external contract / expected schema / compatibility assumption /
          integration change (§65.2)
        - "backfill decision explicit (§25, §65.3 [MUST][BASELINE]): allow null /
          derivable / default / manual fix / unrecoverable"
        - "large backfill designed as production workload: batch / rate limit /
          pause-resume / checkpoint / observability (§27, §53-54)"
        - understand the target database's real runtime behavior — lock level /
          transactional DDL / online index (§50-51); never generalize one
          database's behavior
        - high-risk changes define preconditions by risk (§35)
    - id: A5
      name: Define compatibility combinations and release coupling
      controlMode: engineering-decision
      rules:
        - "non-atomic release must define supported combinations on the real release
          path (§28, §65.4 [MUST][BASELINE]): old-app+new-schema /
          new-app+old-or-transition-schema / rollback-app+new-data; N-A combos
          carry rationale (B1)"
        - decouple from application release to a reasonable degree (§55); no
          forced five-release split for simple changes
        - zero-downtime requirement comes from availability / business
          requirement, never a default hard target (§56)
        - never change production before code, never ship code depending on an
          unexecuted new schema (§21)
    - id: A6
      name: Design transition mechanism (when applicable)
      controlMode: engineering-decision
      rules:
        - EMC phases (§29) or dual read / dual write / fallback read / shadow
          write (§30-31) chosen per real plan — never a default template
        - dual write must answer four questions (atomic? one fails? divergence
          detection? authoritative source?) and register owner / exit condition /
          verification / cleanup + conflict source-of-truth
        - every transition mechanism carries an exit condition; an EMC contract
          phase left uncompleted makes the system worse (§29)
    - id: A7
      name: Design recovery and verification
      controlMode: engineering-decision
      rules:
        - "recovery design (§65.5 [MUST][BASELINE] for high risk): pick from §33
          means plus failure detection; restart / recovery for long migrations (§34)"
        - "verification plan: postcondition (§36) + risk-scaled independent checks
          (§37; low-risk pure DDL may suffice with applied state + integration
          test, classification carries rationale — B1)"
        - high risk verified on scrubbed production-like data (§52); backup /
          restore readiness confirmed when applicable (§35, §49)
        - verification execution hands off to SP-11 / SP-13; this procedure
          defines what must be proven
    - id: A8
      name: Controlled execution of migration / backfill
      controlMode: automation + guardrail   # precondition block / observability / stop-resume
      rules:
        - "chain: precondition check (block when unmet, §35) -> controlled execution
          (versioned artifact; no unrecorded manual change, §65.2) -> runtime
          observability (§53) -> stop/resume with data state legal after stop
          (§54) -> postcondition proof (§36) -> independent verification (§37)
          -> migration evidence (§62)"
        - execution window aligned with SP-15 release-path orchestration; this
          procedure owns professional responsibility for correct execution and
          verification of the migration
    - id: A9
      name: Owner / review organization
      controlMode: engineering-decision
      rules:
        - "four-role coordination (§57): data meaning owner / application owner /
          migration executor-operator / reviewer; small teams may combine;
          high risk adds DBA-platform / security / operations"
        - review checks §58 fifteen items by risk; checklist per §66
          applicability with N-A items carrying rationale (B1); review
          execution = SP-12
    - id: A10
      name: Handoff boundaries and registration
      controlMode: engineering-decision
      rules:
        - material design layer -> SP-05 (migration / backfill / recovery plans as
          design input)
        - code and migration artifact implementation -> SP-06
        - verification execution and candidate conclusion -> SP-11 / SP-12 / SP-13
        - release orchestration and target validation -> SP-15 / SP-17 (migration
          window orchestrated there; execution control stays here)
        - production data fix follows the §42 controlled chain; fix artifact is a
          change artifact, never ad-hoc SQL
        - emergency data repair -> Ch8 + SP-21 pending-definition (group-5);
          professional actions and true data state / recovery evidence never
          exempted (§43)
        - transition mechanisms / dual writes / temp compatibility structures
          registered with exit conditions against permanentization (§29-30)

  gates:
    - id: G-SP08-01
      type: hard-gate
      rule: core-data-meaning-owner-write-authority-invariant-explicit   # §65.1 [MUST][BASELINE]
    - id: G-SP08-02
      type: hard-gate
      rule: schema-out-of-band-data-change-versioned
      note: migration or equivalent versioned/auditable mechanism; externally
            controlled at least versions external contract / expected schema /
            compatibility assumption / integration change   # §65.2
    - id: G-SP08-03
      type: hard-gate
      rule: data-change-must-consider-existing-data   # §65.3
    - id: G-SP08-04
      type: hard-gate
      rule: non-atomic-release-requires-defined-verified-app-schema-combinations
      note: N-A combos carry rationale   # §65.4, §28
    - id: G-SP08-05
      type: hard-gate
      rule: high-risk-data-change-requires-recovery-design
      note: forward-fix / restore / repair / compensation; not every migration
            needs a simple down migration   # §65.5, §32-33
    - id: G-SP08-06
      type: hard-gate
      rule: migration-requires-verification-beyond-exit-code   # §65.6, §36-37
    - id: G-SP08-07
      type: hard-gate
      rule: target-never-precovers-current-data-baseline   # §61, §20, GI-05
    - id: G-SP08-08
      type: hard-gate
      rule: no-dual-write-without-owner-exit-verification-cleanup-and-conflict-sot   # §30-31
    - id: G-SP08-09
      type: hard-gate
      rule: never-production-first-or-code-depending-on-unexecuted-schema   # §21
    - id: G-SP08-10
      type: hard-gate
      rule: gate-zeroing-judgment-requires-resolvable-rationale
      note: covers additive-zero-risk assumptions / low-risk-pure-DDL
            classifications / N-A combos / backup-exists-equals-recovery claims;
            re-challengeable by SP-05 / SP-13 / group audit   # B1, §22, §49

  passExit:
    designBranch:
      equals: >
        Data Evolution & Execution Plan established (bound to current data
        baseline + scope): meaning and ownership facts explicit + current /
        target / (transition) distinguished + versioned migration / backfill
        plan + compatibility combinations defined + recovery design +
        verification plan -> handoff to SP-05 (when material) / SP-06
    executionBranch:
      equals: >
        precondition passed -> controlled execution (full observability) ->
        postcondition proven + independent verification conclusion (handed to
        SP-11 / SP-13) -> migration evidence complete (§62) -> handoff to
        SP-15 / SP-17 delivery chain
    doesNotMean: [verification-passed, release-completed,
                  current-data-baseline-updated, derived-data-rebuilt]

  returnPaths:
    - condition: precondition unmet
      next: block execution; back to A4 to fix prerequisites or adjust plan;
            never gamble on (§35)
    - condition: postcondition / independent verification failed
      next: dispose per recovery design (§33); never enter delivery with
            unexplained inconsistency
    - condition: semantic / owner void
      next: back to A2 to fill; never proceed on semantic void
    - condition: compatibility combination unsupportable (rollback / old app)
      next: back to A5 to redefine combinations or adjust release orchestration
            (§28, §55)
    - condition: material design problem
      next: SP-05
    - condition: dual-write divergence without conflict source-of-truth
      next: stop dual-write progression; back to A6 to define (§31)
    - condition: emergency data repair
      next: Ch8 + SP-21 pending-definition (group-5) compressed path; §43 record
            chain and this procedure's evidence never exempted

  exceptions:
    - id: E-small-compatible-schema-change
      rule: "lightweight form (§64.1): migration + integration test + deployment
            order check; the three preconditions (small / compatible / single
            application) carry rationale (B1)"
    - id: E-single-consumer-atomic
      rule: single consumer + schedulable maintenance window + atomic
            app-schema coordination + acceptable risk -> direct rename /
            one-step change may be the simpler correct plan (§24); real
            compatibility requirement decides, never mechanical EMC
    - id: E-emergency-data-repair
      rule: "fast path (§43): emergency approval -> minimal safe fix -> verify ->
            record -> post-facto review -> change record / evidence backfill ->
            migration / baseline update when needed; compression and
            reconciliation = Ch8 + SP-21 pending-definition (group-5); fast path
            never traceless"
    - id: E-low-risk-pure-ddl-verification
      rule: low-risk pure DDL may suffice with migration tool applied state +
            integration test (§37); classification carries rationale (B1) and is
            never used for transformational / destructive changes

  evidenceByWork:
    natural:
      - data evolution record (semantics / ownership / judgment basis)
      - versioned migration artifact + applied state records
      - backfill decision record
      - compatibility combinations with verification status
      - recovery design + (when applicable) restore verification fact
      - migration evidence (§62 ten items)
      - review record (SP-12, revision-bound)
    extraOnlyFor: [backfill-decision, na-combination-rationale,
                   low-risk-classification-rationale, destructive-five-questions,
                   dual-write-four-questions-and-exit, emergency-repair-record]
    rule: all other evidence emerges naturally from the work

  currentUpdateObligation:
    writesCurrent: false
    boundaries:
      - current data baseline describes current data-engineering facts with
        environment / baseline scope (§59-60); target data design never
        pre-covers current before migration completes (§61)
      - applied migration state (§19) and migration evidence (§62) are execution
        fact records, not current rewrites
      - current data baseline migration goes explicitly through SP-19 after
        release / baseline transition completes

  theoryTrace:
    part1: [GI-03, GI-05]
    part2: [p2-ch8-data-full-chapter,        # WHAT authority
            p2-ch7-13-data-contract-boundary-prerequisite]   # owned by SP-07
    part2Note: >
      P2 Ch8 §43 / §68 cite the old SP lineage (SP-22 emergency, SP-23 / SP-24,
      SP-25~27 calibration); mapped under the SP-22 cap: SP-22 -> SP-21
      (group-5 pending), SP-25~27 -> SP-19; SP-23 / SP-24 have no definition
      source in the capped system — not reserved, not cited (master index §1
      numbering authority).
    part3: [data-shared-infra-runtime-mapping]   # Ch6 data / infra / runtime faces
    part4: [ch3-data-migration-impact-deepening, ch4-transition-design-handoff,
            ch5-migration-artifact-implementation, ch7-migration-window-in-release,
            ch8-emergency-data-repair-path]
    journey: [JG-04]

  executableAssets: [EA-09, EA-08, EA-17]
  assetRule: >
    tooling fits: applied state recording, precondition / postcondition
    mechanical checks, validation query execution, observability collection,
    migration orchestrated execution. Tooling does not fit: backfill decisions,
    compatibility combination definition, recovery design, destructive five
    questions, dual-write adoption decisions. A filled template is never
    judgment evidence (GI-06).

  referenceProfiles:
    - id: RP-ONLINE-API-PY-GH
      bindings:
        migration_carrier: Alembic (versioned + applied state)
        backfill: controlled batch job
        current_data_baseline: data authority doc + alembic head + backfill state record
        high_risk_verification: scrubbed production-like replica
        observability: job progress + database metrics
    - id: RP-B-CLI   # pending-definition (group-6)
      bindings:
        persisted_surface: local state files / embedded DB (e.g. SQLite); schema
                           versioned with package release
        compatibility: new CLI + old local state (upgrade path); rollback per
                       install shape
    - id: RP-C-SDK   # pending-definition (group-6)
      bindings:
        persisted_surface: "usually no owned persistence authority; when carrying
                           local storage / cache schema: versioned + upgrade path
                           + old-version readability defined"
        consumer: uncontrollable -> storage format evolution judged most
                  conservatively

  example:
    ref: CHG-WO-142
    continues: SP-07 example (transfer API reason compatibility judgment) and
               P2 Ch8 §64.2 "WorkOrder adds Transfer Reason" standard business
               data change; data-side professional actions behind contract C9 /
               migration V203
    highlight: >
      V203 = ADD COLUMN transfer_reason TEXT NULL, carrying the structured
      reason payload {category: from the config-driven allowed-value list
      (SP-09 A7 handoff); note: free text, internal part never leaves the
      boundary (SP-10 A3 serialization filter)} in serialized form. Null
      semantics explicitly registered (empty = legacy rows had no recording
      requirement / new data optional, §12); column-scoped backfill decision =
      transfer_reason legacy rows allowed null, no derivation, no default, no
      manual fix — recorded with rationale (§25, §65.3). The search-index
      historical-row rebuild is a separate workload: S5 reindex backfill
      designed as a production workload (batch / rate limit / pause-resume /
      checkpoint / reconciliation, §27 §53-54) — the object of SP-15's
      "backfill pause" recovery and the input to SP-17's "migration
      reconciliation complete". Compatibility: old-app+new-schema supported,
      verification pending (execution via SP-11 / SP-13); new-app+old-schema
      N/A with rationale (migration deploys before app, B1); rollback-app+
      new-schema supported. Low-risk additive: recovery = restore readiness +
      forward-fix plan; verification = postcondition + integration test handed
      to SP-11 / SP-13. The API-layer optional-reason judgment (SP-07 A3) and
      the data-layer nullable evolution together uphold "the reason-required
      end state never advances silently in this change".
