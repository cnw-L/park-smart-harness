# SP-17 Target Validation / Release Completion — Operation Contract
# Machine-loadable mirror of 第五篇-SP17-TargetValidation-正式操作规程.md
# The Markdown body is the normative source; this contract is its structured projection
# for harness execution (park-smart-harness). Semantics must not diverge: if they do,
# repair the projection, never the reverse (GI-13).
apiVersion: spec.part5/v1alpha1
kind: OperationContract
metadata:
  id: SP-17
  name: Target Validation / Release Completion
  status: sealed                   # 2026-08-31 group-3 audit PASS AFTER REPAIR + regression 1050 citations VERIFIED (2 note-level repairs)
  version: 1.0.0
  normativeSource: 第五篇-SP17-TargetValidation-正式操作规程.md
  singleResponsibility: >
    On an explicit delivery target / deployment attempt / rollout slice, validate
    whether the software state actually present in the target environment —
    runtime behavior, dependencies, data / migration, transition invariants,
    applicable business / quality requirements — meets the conditions this
    delivery / release acceptance requires; render per-target-scope
    SATISFIED / FAILED / NOT_READY assessments and the target release
    completion decision; and migrate the accepted current release through the
    Ch1 ledger after completion. Target validation is not a Ch6 rerun, pass is
    not deployment success, evidence gaps are NOT_READY not FAIL, and unmet
    validation maturity stays NOT_READY regardless of smoke / deploy green.

spec:

  triggers:
    - id: T-attempt-done-or-slice-in-place   # need the target / slice validation verdict
    - id: T-evidence-arrives-or-gap-visible
    - id: T-maturity-event                   # representative traffic / background cycle /
                                             # reconciliation / convergence
    - id: T-completion-decision-point        # rollout / transition reached planned state
    - id: T-post-recovery                    # recovery validation + post-recovery accepted release
    - id: T-validation-evidence-gap          # metrics missing / smoke unavailable /
                                             # observability broken / migration outcome unknown
  boundaryRule: >
    Never re-runs the Ch6 required verification set (SP-13), never controls
    deployment / rollout execution (SP-15), never owns feature exposure strategy
    (SP-16 — pending-definition, group-5) or recovery execution detail
    (SP-18 — pending-definition, group-5; until it lands, recovery execution
    follows P4 Ch7 §89-102 directly and SP-15 keeps the execution records), and
    never performs change closure or project-level current updates (SP-19). Its
    only current write is the per-target-scope accepted current release ledger
    transition after target release completion.

  inputs:
    required:
      - name: release_baseline_and_acceptance  # SP-15 / SP-13: identity, scope, known exceptions
        type: ref
      - name: delivery_target_and_rollout_scope
        type: config
        rule: explicit target scope; slice sequence and observation plan from SP-15
      - name: deployment_observation_record    # SP-15: attempt results, runtime state
        type: record-set                       # incl. mixed state, slice-level signals
      - name: ch4_constraints
        type: reference-set
        members: [transition-invariants, rollout-recovery-direction]
      - name: ch3_runtime_quality_risk
        type: ref                              # drives depth and maturity requirements
      - name: observability_capability
        type: asset                            # EA-15; signals decomposable by version / cohort
    optional:
      - name: target_specific_dependency_policy
        type: policy
      - name: recovery_attempt_facts           # trigger E: 8 of the 9 P4 Ch7 §98
                                               # fields opened by SP-15 A12 / SP-18 —
                                               # incl. recovery-attempt-id (anchors the
                                               # facts to the attempt identity);
                                               # validation conclusion produced here (A10)
        type: ref
    upstreamRechallenge: >
      Gate-zeroing classifications in upstream handoffs (SP-15 rollout proceed
      basis, observation N-A claims, known-exception "controlled" claims,
      recovery anchor verifications) must carry resolvable rationale; ungrounded
      ones return to the source procedure. This procedure's own N-A / maturity
      waivers carry rationale and stay re-challengeable by SP-19 / group audits
      (B1 rule).

  outputs:
    primary:
      kind: TargetValidationBundle
      fields:
        - name: required_target_validation_set
          rule: environment-specific obligations derived from release baseline +
                delivery target + rollout / transition scope; each obligation carries
                objective / required evidence / pass basis / applicable context /
                source pointer
        - name: target_evidence
          rule: reuses the Ch6 six elements; subject = applicable object inside
                deployment attempt / runtime slice / target state
        - name: target_validation_assessment
          vocabulary: [SATISFIED, FAILED, NOT_READY]
          rule: per target scope; one scope's verdict never extrapolates
        - name: maturity_status_records
          fields: [condition, satisfaction-fact]   # per obligation with a maturity condition
        - name: validation_gap_records
          fields: [gap, affected-obligations, disposition]
        - name: target_release_completion_record
          rule: decision + basis; always carries the target scope
        - name: accepted_current_release_transition
          rule: ledger transition record (from / to / target scope / completion ref / at)
        - name: recovery_validation_conclusion
          fields: [safe-state-reached, restored-conditions, next-step]
    nonOutputs:
      - candidate-level-verification        # SP-13
      - deployment-or-rollout-control       # SP-15 (proceed / pause stay there)
      - feature-exposure-strategy           # SP-16 (pending-definition, group-5)
      - recovery-execution                  # SP-18 (pending-definition, group-5)
      - change-closure-or-project-current   # SP-19

  invariants:
    - id: target-validation-not-ch6-rerun
    - id: pass-not-deployment-success
    - id: fail-only-on-valid-evidence
    - id: gap-is-not-ready-not-fail
    - id: unmatured-obligation-stays-not-ready
    - id: maturity-not-fixed-soak-time
    - id: target-scoped-no-extrapolation
    - id: completion-not-change-closure
    - id: accepted-release-only-via-ledger
    - id: recovery-command-success-not-complete

  actions:
    - id: A1
      name: Derive the required target validation set
      controlMode: engineering-decision + guardrail
      sources: [release-baseline-candidate-acceptance, ch4-transition-invariant,
                ch4-rollout-recovery-direction, ch3-runtime-quality-risk,
                deployment-definition, target-specific-dependency-policy,
                migration-data-requirement, known-exception]
      rules:
        - per release baseline + delivery target + rollout / transition scope
        - concerns picked by applicability from the twelve-item list; N-A items
          carry rationale (B1)
        - never a Ch6 full-set rerun — answers "did it become the expected
          runtime fact in this target"
    - id: A2
      name: Declare validation maturity conditions
      controlMode: engineering-decision
      rules:
        - "per obligation where needed: representative traffic floor / required
          background cycle / reconciliation complete / queue settled / no new
          invariant violation during the observation condition"
        - risk / behavior drives maturity; a global fixed soak time never
          substitutes the semantics; undeclared-never-missing
        - obligations with no maturity need record the instant-evidence judgement
    - id: A3
      name: Bind target evidence
      controlMode: automation + guardrail
      rules:
        - six elements bound at production time; subject explicit to attempt /
          slice / target state; context records actual resolution
        - signals must decompose by version / cohort to this slice / attempt;
          under-attributed evidence gets an applicability limitation
    - id: A4
      name: Execute validation and record results truthfully
      controlMode: automation + guardrail
      rules:
        - valid evidence proves satisfaction = PASS
        - only valid evidence explicitly proving non-satisfaction = FAIL
        - unavailable evidence / environment / window / unknown outcome =
          NOT_READY + gap record
        - deployment tool success is never a PASS basis
    - id: A5
      name: Judge maturity satisfaction
      controlMode: guardrail
      rule: unmet maturity condition keeps the obligation NOT_READY even when all
            instant checks are green; satisfaction facts recorded before the
            evidence enters completion judgement
    - id: A6
      name: Form the target validation assessment
      controlMode: guardrail
      rules:
        - all applicable obligations satisfied -> SATISFIED; any valid FAIL ->
          FAILED; undisposed gap / unmatured obligation -> NOT_READY
        - always per explicit target scope
    - id: A7
      name: Dispose gaps and findings
      controlMode: engineering-decision + authority
      dispositions: [alternative-evidence, controlled-exception, block-decision]
      rules:
        - high-risk scenarios never proceed on "looks fine" under an evidence gap
        - candidate-defect evidence routes to SP-15 A11 as candidate-defect-in-target
        - target environment defects route to SP-15 / platform domain without
          touching candidate disposition
    - id: A8
      name: Decide target release completion
      controlMode: decision-point
      conditions: [rollout-transition-reached-required-state,
                   required-target-validation-satisfied,
                   known-exceptions-controlled]
      rules:
        - satisfied -> issue the completion record with explicit target scope
        - otherwise stay and record the gap
        - completion is a decision / progress fact, never change closure
    - id: A9
      name: Migrate accepted current release via the ledger
      controlMode: automation + guardrail
      rules:
        - after completion, register the target scope's accepted current release
          transition through the Ch1 baseline transition ledger
        - never edit a global current-release pointer; never wait on other scopes;
          never wait on change closure
        - multi-target partial acceptance is legal
    - id: A10
      name: Recovery validation and post-recovery judgement
      controlMode: guardrail + engineering-decision
      outcomes:
        - "safe-state-reached: accepted current release keeps / returns to the
          previous accepted release via A9's ledger mechanism"
        - "not-reached: stay NOT_READY; next step explicit (re-deliver / further
          recovery / incident-rework)"
        - evidence-insufficient: gap disposition via A7
      rules:
        - confirm the target actually entered the expected safe state — old
          artifact truly running, data readable, critical flows restored,
          migration / traffic safe
        - recovery command success never counts; execution detail stays with SP-18

  gates:
    - id: G-SP17-01
      type: hard-gate
      rule: validation-set-environment-specific-and-fully-disposed-before-acceptance
    - id: G-SP17-02
      type: hard-gate
      rule: no-ch6-rerun-as-target-validation; deployment-success-never-validation-pass
    - id: G-SP17-03
      type: hard-gate
      rule: fail-only-on-valid-evidence; gaps-are-not-ready
    - id: G-SP17-04
      type: hard-gate
      rule: unmatured-obligation-stays-not-ready; smoke-deploy-health-never-trigger-
            completion-alone
    - id: G-SP17-05
      type: hard-gate
      rule: no-global-fixed-soak-time-as-maturity-semantics
    - id: G-SP17-06
      type: hard-gate
      rule: every-verdict-and-completion-carries-explicit-target-scope
    - id: G-SP17-07
      type: hard-gate
      rule: accepted-current-release-migrates-only-via-ledger-after-completion
    - id: G-SP17-08
      type: hard-gate
      rule: completion-not-closure; runtime-facts-never-delayed-for-closure
    - id: G-SP17-09
      type: hard-gate
      rule: high-risk-never-proceeds-on-looks-fine-under-evidence-gap
    - id: G-SP17-10
      type: hard-gate
      rule: recovery-validation-confirms-actual-safe-state
    - id: G-SP17-11
      type: hard-gate
      rule: na-maturity-waiver-exception-carry-rationale-and-stay-rechallengeable   # B1

  passExit:
    equals: target-validation-truthfully-assessed-and-completion-honestly-decided
    minimumConditions:
      - validation set derived, environment-specific, no ungrounded N-A
      - every obligation has PASS (valid evidence) / FAIL (valid evidence) /
        NOT_READY (gap record)
      - maturity conditions verified; unmatured obligations stay NOT_READY
      - assessment formed per target scope, no extrapolation
      - completion conditions checked item by item; completion record carries scope
      - accepted current release migrated via ledger (or honestly unchanged)
      - gaps / findings disposed and routed; candidate-defect evidence returned
        to the SP-15 / SP-13 chain
    doesNotMean: [candidate-reverified, other-scopes-complete, feature-exposed,
                  change-closed, current-design-updated, incident-resolved]

  returnPaths:
    - condition: target validation FAILED on valid evidence
      next: finding classification via SP-15 A11 — candidate defect -> SP-13 / SP-06
            chain; environment / dependency defect -> platform domain
    - condition: target validation NOT_READY
      next: add evidence / fix observability / await maturity / controlled exception /
            block; never relabel as PASS or FAIL
    - condition: maturity durably unreachable
      next: re-review condition design (risk change) or escalate; silently deleting
            the condition forbidden
    - condition: completion conditions unmet
      next: hold and expose the gap; rollout side returns to SP-15 A8 (pause /
            reverse direction)
    - condition: recovery validation not reached
      next: stay NOT_READY -> SP-18 (pending-definition, group-5; until then P4 Ch7
            §89-102 body with SP-15 keeping execution records) further recovery /
            incident; never rewrite the accepted current release to fake recovery

  exceptions:
    - id: E-small-team
      rule: CI/CD deployment records + monitoring / smoke checks may carry the
            semantics; the carrier folds, obligation disposition / maturity /
            NOT_READY semantics / ledger migration never fold
    - id: E-observability-gap
      rule: missing required telemetry is itself NOT_READY; disposition is fixing
            observability or a controlled exception; high-risk targets never
            complete under the gap
    - id: E-client-distribution
      rule: client delivery validates via distribution / channel / cohort /
            installation / adoption / version exposure / withdrawal records;
            concerns derived by applicability with subject = cohort / exposure facts
    - id: E-emergency
      rule: validation depth and maturity windows compressible under Ch8 fast-path;
            never an evidence-less non-reconciled release mechanism; compressed
            scope and residual risk recorded, reconciled afterwards via SP-21
            (pending-definition, group-5) / SP-19

  evidenceByWork:
    natural:
      - observability systems, verification jobs, platform records
      - SP-15 slice-level observation records
    extraOnlyFor: [required-target-validation-set-with-source-pointers,
                   maturity-condition-declarations-and-facts, not-ready-gap-dispositions,
                   completion-records, ledger-transition-records,
                   recovery-validation-conclusions]
    rule: the carrier folds into existing systems; semantic records never waived

  currentUpdateObligation:
    writesCurrent: accepted-current-release-ledger-only
    note: >
      The procedure's only current write is the per-target-scope accepted current
      release ledger transition after target release completion — a Ch7-domain
      target environment fact it registers itself. Project-level currents
      (design / structure / calibration / change closure) all go through SP-19;
      this procedure's validation conclusions and runtime facts are SP-19
      calibration's actual evidence sources.

  theoryTrace:
    part1: [GI-03, GI-05, GI-13, ch1-baseline-transition-ledger-decision]
    part2: [deploy-not-release-not-launch, testing-verification-what-boundary]
    part3: [runtime-where-as-validation-subject]
    part4: [ch5-unreliable-feedback-gap-semantics-88-94,
            ch6-evidence-semantics-38-55, ch6-coverage-gap-not-ready-66-75,
            ch7-deployment-result-not-validation-37,
            ch7-rollout-observation-attribution-46-59,
            ch7-runtime-state-observation-record-60-65,
            ch7-target-validation-set-results-maturity-completion-66-85,
            ch7-recovery-validation-99-101, ch7-evidence-gap-high-risk-110,
            ch7-minimum-requirements-139, ch7-maturity-completion-141,
            ch7-ch6-interface-143, ch8-emergency-144, ch9-interface-145]

  executableAssets: [EA-15, EA-08, EA-16, EA-13]
  assetRule: >
    Tooling fits: collecting and decomposing signals, executing smoke /
    reconciliation checks, verifying maturity facts, registering ledger
    transitions. Tooling does not fit: obligation derivation and trimming
    conclusions, maturity condition design, controlled exception approval,
    completion decision conclusions, "looks fine" judgements.

  referenceProfiles:
    - id: generic-layer
      bindings:
        applies: all profiles share operation contract / theory trace / evidence / control semantics
    - id: delivery-shape
      bindings:
        rule: shape decides validation subject form (server runtime slice vs client
              distribution cohort / version exposure) and the available signal surface
    - id: risk-overlay
      bindings:
        rule: overlay decides obligation depth, maturity strictness, evidence-gap
              exception room (tightened at high risk), completion automation degree;
              concrete mappings registered in group-6

  example:
    ref: CHG-WO-142-RELEASE-1.9.0-PRODUCTION-US
    continues: SP-15 example (attempt D1, slice S1, recovery R1)
    highlight: >
      The required target validation set for WO-1.9.0 + Production-US includes
      artifact presence, V203 schema state, search correctness, transfer flow,
      version-specific error rate, transition invariants, data reconciliation and
      observability availability; reconciliation and search correctness carry
      maturity conditions (reconciliation complete, representative sample). On
      slice S1 a material new-version transfer error is valid evidence of
      non-satisfaction — the obligation FAILs, the scope assessment is FAILED,
      and proceed stops. After recovery R1, recovery validation confirms 100%
      v1.8 serving, healthy transfer flow, inactive bad path and consistent data;
      the ledger keeps accepted current release at 1.8. Later WO-1.9.1 reaches
      all-green with both maturity conditions met: completion issues for
      Production-US and the ledger migrates 1.8 -> 1.9.1, while Production-EU
      legally stays at 1.8. Red lines: broken metrics pipelines are NOT_READY
      gaps that high-risk never waves through on "looks fine"; smoke green with
      an unfinished reconciliation cycle stays NOT_READY; no completion claim
      without a target scope and no global current-release pointer edits.
