# SP-15 Release / Deployment — Operation Contract
# Machine-loadable mirror of 第五篇-SP15-ReleaseDeployment-正式操作规程.md
# The Markdown body is the normative source; this contract is its structured projection
# for harness execution (park-smart-harness). Semantics must not diverge: if they do,
# repair the projection, never the reverse (GI-13).
apiVersion: spec.part5/v1alpha1
kind: OperationContract
metadata:
  id: SP-15
  name: Release / Deployment
  status: sealed                   # 2026-08-31 group-3 audit PASS AFTER REPAIR + regression 1050 citations VERIFIED (2 note-level repairs)
  version: 1.0.0
  normativeSource: 第五篇-SP15-ReleaseDeployment-正式操作规程.md
  singleResponsibility: >
    Form an accepted candidate into a release baseline with truthful, immutable
    identity and explicit scope; make the release decision; make traceable,
    revalidatable per-target delivery authorization; execute controlled
    deployment attempts and rollouts; maintain truthful, timely environment
    current runtime state; and route delivery findings back to the correct
    layer. SP-14 produces identity, SP-13 decides candidate acceptance and
    evidence re-evaluation; SP-17 owns target validation and completion;
    SP-16 owns feature exposure detail (pending-definition, group 5); SP-18
    owns recovery execution detail (pending-definition, group 5 — until it
    lands, recovery execution follows Ch7 §89-102 directly and this
    procedure keeps the execution records).
    Release formation never rebuilds a "similar" artifact and claims it verified.

spec:

  triggers:
    - id: T-release-formation               # accepted candidate enters delivery preparation
    - id: T-release-decision-or-authorization
    - id: T-authorization-revalidation      # one of the eight revalidation triggers fired
    - id: T-deployment-attempt-or-rollout   # execute / retry attempt; advance / pause slice
    - id: T-delivery-finding
    - id: T-outcome-unknown-or-stale-intent   # incl. concurrent delivery conflict
    - id: T-sp17-assessment-arrives           # target validation FAILED / NOT_READY ->
                                              # proceed control + finding routing
  boundaryRule: >
    Never produces candidate acceptance or evidence applicability conclusions
    (SP-13), artifact identities (SP-14), target validation conclusions /
    target release completion / accepted current release updates (SP-17),
    feature exposure strategy (SP-16, pending-definition), recovery execution
    detail (SP-18, pending-definition), or any project-level current update
    (SP-19). Release formation references verified identities;
    it never rebuilds content. Deployment tool success is never target
    validation; environment current runtime state is never accepted current
    release.

  inputs:
    required:
      - name: accepted_candidate            # SP-13: revision + acceptance scope + basis + evidence set
        type: ref
      - name: artifact_identity_list        # SP-14: digest identities + promotion records + delta disposition
        type: reference-set
      - name: deployment_definition_revision
        type: ref                           # EA-12
      - name: delivery_target_definition
        type: config
        rule: explicit target scope; readiness inputs by applicability, no global checklist
      - name: ch4_constraints
        type: reference-set
        members: [transition-invariants, rollout-recovery-direction, feature-exposure-design]
      - name: risk_policy
        type: policy                        # authorization automation, concurrency, rollout necessity
    optional:
      - name: recovery_anchor_candidates    # previous accepted release / verified old digest /
        type: reference-set                 # data restore point / stable traffic pool
      - name: existing_delivery_authorization
        type: ref                           # trigger C: authorization record + basis
      - name: target_validation_assessment  # SP-17 (conditional): slice / attempt /
        type: ref                           # target-scope SATISFIED / FAILED / NOT_READY;
                                            # FAILED arrival -> proceed = STOP + finding
                                            # routing (A11) / recovery evaluation (A12)
    upstreamRechallenge: >
      Gate-zeroing classifications in upstream handoffs (SP-14 same-artifact /
      inheritance claims, SP-13 accepted-with-exception records, readiness N-A
      claims) must carry resolvable rationale or evidence pointers; ungrounded
      ones return to the source procedure (B1 rule).

  outputs:
    primary:
      kind: ReleaseDeliveryBundle
      fields:
        - name: release_baseline
          fields: [release-identity, member-references, deployment-definition-revision,
                   candidate-evidence-set-ref]
          rule: members referenced, never rebuilt; identity immutable once issued;
                coherence verified
        - name: release_decision_record
          rule: reuses Ch1 decision machinery; bound to release revision
        - name: delivery_authorization
          fields: [target-scope, authorization-basis, applicability-boundary,
                   revalidation-conditions]
          rule: basis is a traceable set; authorization is a decision point, not
                a human approval
        - name: deployment_attempt_record
          rule: attempt identity (8 fields) + per-step facts; retries get new
                attempt identities, old failure records never overwritten
        - name: environment_deployment_record
        - name: rollout_record
          fields: [slice-sequence, observation, proceed-pause-decisions, basis]
        - name: environment_current_runtime_state
          rule: actual runtime fact incl. legal mixed state; updated timely;
                never masquerades as accepted current release
        - name: deployment_observation_record  # SP-17 target validation input
        - name: delivery_finding_records
          rule: ten-class classification + return path + owner
        - name: recovery_decision_inputs
          fields: [trigger, actual-state, anchor-verification, compatibility-check,
                   path-recommendation]      # execution detail goes to SP-18
    nonOutputs:
      - target-validation-or-completion            # SP-17
      - accepted-current-release-update            # SP-17 ledger transition at completion
      - candidate-acceptance-or-applicability      # SP-13
      - artifact-identity                          # SP-14
      - feature-exposure-strategy                  # SP-16
      - recovery-execution-or-validation           # SP-18 (pending-definition) / SP-17
      - project-level-current-update               # SP-19; runtime state fact is this
                                                   # procedure's own write (see
                                                   # currentUpdateObligation)

  invariants:
    - id: release-formation-never-rebuilds
    - id: release-identity-immutable-no-silent-repoint
    - id: release-decision-not-delivery-authorization
    - id: authorization-not-a-permanent-pass
    - id: deployment-result-not-target-validation-result
    - id: runtime-state-not-accepted-current-release
    - id: outcome-unknown-never-blindly-retried
    - id: stale-intent-never-overrides-new-reality
    - id: failed-history-never-deleted

  actions:
    - id: A1
      name: Verify release formation entry
      controlMode: guardrail
      rules:
        - candidate accepted with exceptions visible; acceptance scope covers intent
        - SP-14 identity list resolvable; formation scope explicit (no fixed env chain)
        - re-challenge upstream gate-zeroing classifications (B1)
    - id: A2
      name: Compose the release baseline
      controlMode: automation + guardrail
      rules:
        - "reference (never rebuild) SP-14 identities: artifact, migration, contract,
          config schema/profile, deployment definition revision, evidence set ref"
        - verify member coherence; issue immutable release identity
        - every new-identity materialization delta has its SP-13 re-evaluation
          conclusion recorded before formation completes
    - id: A3
      name: Make the release decision
      controlMode: decision-point             # reuses Ch1 machinery; automation by risk
      rule: bound to release revision; passing authorizes no target
    - id: A4
      name: Make / re-judge delivery authorization
      controlMode: decision-point + policy
      steps:
        - collect target readiness facts by applicability (no global checklist)
        - compose the authorization basis as a traceable set
        - decide per target scope; automation degree set by risk / policy
        - register applicability boundary and revalidation conditions
      revalidation:
        triggers: [release-baseline-or-candidate-changed,
                   target-runtime-or-migration-state-materially-changed,
                   target-readiness-condition-changed,
                   freeze-policy-or-change-window-changed,
                   known-exception-expired-or-changed,
                   critical-dependency-or-capacity-changed,
                   recovery-anchor-unavailable,
                   another-target-changing-change-altered-same-boundary,
                   # procedure-level extension beyond the P4 Ch7 §30 eight,
                   # registered in the group baseline index:
                   related-delivery-finding-arrives]
        rule: re-judgement can be automated; it is not necessarily a new human
              approval; continuation must be explicit and the judgement recorded;
              lapsed basis invalidates the authorization
    - id: A5
      name: Check release entry conditions
      controlMode: guardrail
      checks: [release-baseline, delivery-target, delivery-authorization,
               target-readiness, deployment-definition, rollout-strategy-direction,
               target-validation-requirement, recovery-direction]   # P4 Ch7 §32 floor
      procedureAdditions: [concurrency-judged, known-exceptions-controlled,
                           responsibility-clear, observation-available]
                                            # registered in the group baseline index
      rule: recovery prerequisites available = recovery anchor verified to really exist
    - id: A6
      name: Execute the deployment attempt
      controlMode: automation + guardrail
      attemptIdentity: [attempt-id, release-baseline, delivery-target,
                        deployment-definition-revision, target-config-reference,
                        migration-transition-phase, started-at, executor-actor]
                                            # P4 Ch7 §35 eight fields; strategy /
                                            # starting-accepted-release in the example
                                            # are WorkOrder-scene extensions (§125)
      rules:
        - record per-step results; emit the environment deployment record
        - retry of the same release gets a new attempt identity; old records kept
    - id: A7
      name: Control steps and unknown outcomes
      controlMode: guardrail + engineering-decision
      rules:
        - steps preferably idempotent; non-idempotent steps register a reconcile path
        - "unknown outcome (timeout / crash / partial migration): never retry directly —
          inspect actual target state, reconcile, then decide resume / retry / recovery"
        - retries form traceable facts
        - deployment result recorded apart from target validation conclusions
    - id: A8
      name: Execute rollout
      controlMode: engineering-decision + guardrail
      rules:
        - rollout necessity judged by risk / policy — not every deployment needs one
        - scope and slice sequence explicit; slice is not candidate scope
        - per-slice observation with canary / control comparison; metrics decomposed
          by version / cohort — aggregate green never masks slice failure
        - insufficient representativeness downgrades the conclusion
        - proceed decisions cite Ch4 invariants + slice target evidence, never a timer
        - pause is normal and recorded
        - "attribution conflict: isolate / decompose / pause one change / downgrade
          to NOT_READY"
    - id: A9
      name: Maintain environment current runtime state
      controlMode: automation + guardrail
      rules:
        - update timely after every target-changing action; mixed state recorded honestly
        - never equate with accepted current release or release completion
        - emit deployment observation records for SP-17
    - id: A10
      name: Enforce ordering / generation / authority
      controlMode: automation + guardrail
      rules:
        - maintain a target deployment generation per material target (monotonic id /
          GitOps commit / lease / lock all legal)
        - every target-changing action — including delayed rollback, automated recovery,
          traffic revert, feature disable — confirms its authority token is not
          superseded before executing
        - outdated attempts never become desired state; block and record
        - same-boundary concurrency gets explicit ordering / isolation; no global
          single-deployment mandate
    - id: A11
      name: Classify and route delivery findings
      controlMode: engineering-decision       # tools may suggest; conclusions stay human
      vocabulary: [release-baseline-packaging, candidate-defect-in-target,
                   deployment-process-defect, target-environment-infrastructure,
                   migration-data, rollout-transition, validation-evidence-gap,
                   external-dependency, requirement-design-impact-gap, unknown]
      routing:
        release-baseline-packaging: back to A2 or SP-13
        candidate-defect-in-target: re-evaluate candidate disposition -> SP-13 / SP-06 /
                                    SP-05 / SP-04; never just "deployment failed"
        deployment-process-defect: fix EA-12; judge evidence applicability impact
        target-environment-infrastructure: repair target; same release may redeploy
        migration-data: judge implementation / design / data-assumption / target-only /
                        unknown first, then route
        rollout-transition: rollout control / Ch4 transition design
        validation-evidence-gap: SP-17 NOT_READY; high-risk never proceeds on
                                 "looks fine"
        external-dependency: isolate / degrade; SP-09 domain (pending-definition,
                             group 4; until it lands, follow the Ch3 / Ch5 dependency
                             governance body)
        requirement-design-impact-gap: SP-05 / SP-04 / requirement authority
        unknown: retain; fabrication forbidden
    - id: A12
      name: Recognize recovery triggers and prepare decision inputs
      controlMode: engineering-decision + guardrail
      rules:
        - recognize the nine trigger classes; assemble actual state + failure/unknown
          evidence + Ch4 recovery direction + data/contract compatibility check
          + anchor verification
        - no globally fixed rollback-vs-rollforward choice
        - forward fix producing new software content routes back to SP-06 / SP-13
          or the Ch8 compressed path with mandatory after-the-fact reconciliation
        - open the recovery attempt fact frame (eight of the nine P4 Ch7 §98 fields —
          validation stays with SP-17); execution detail is SP-18 (pending-definition)
        - recovery command success is never recovery complete; validation and
          post-recovery accepted-current-release judgement are SP-17 / SP-18
        - failed attempt / partial state / recovery history never deleted

  gates:
    - id: G-SP15-01
      type: hard-gate
      rule: release-formation-never-rebuilds-a-similar-artifact-and-claims-it-verified
    - id: G-SP15-02
      type: hard-gate
      rule: new-materialized-identity-blocks-formation-until-sp13-reevaluation-recorded
    - id: G-SP15-03
      type: hard-gate
      rule: release-identity-immutable; changes-mean-new-revision
    - id: G-SP15-04
      type: hard-gate
      rule: authorization-attempt-completion-claims-carry-explicit-target-scope
    - id: G-SP15-05
      type: hard-gate
      rule: authorization-applicability-bound-by-revalidation-triggers; no-permanent-pass
    - id: G-SP15-06
      type: hard-gate
      rule: no-blind-retry-of-non-idempotent-steps-on-unknown-outcome
    - id: G-SP15-07
      type: hard-gate
      rule: rollout-proceed-on-invariants-plus-slice-evidence; aggregates-never-mask;
            timer-never-sufficient
    - id: G-SP15-08
      type: hard-gate
      rule: runtime-state-truthful-and-timely; mixed-state-never-masquerades-as-accepted
    - id: G-SP15-09
      type: hard-gate
      rule: every-target-changing-action-confirms-unsurperseded-authority-token
    - id: G-SP15-10
      type: hard-gate
      rule: findings-ten-class-classified-and-routed; candidate-defect-forces-reevaluation
    - id: G-SP15-11
      type: hard-gate
      rule: recovery-anchor-verified-real-before-reliance; binary-rollback-checks-
            data-contract-compatibility
    - id: G-SP15-12
      type: hard-gate
      rule: failed-attempt-partial-state-recovery-history-never-deleted
    - id: G-SP15-13
      type: hard-gate
      rule: zeroing-classifications-carry-rationale-and-stay-rechallengeable   # B1

  passExit:
    equals: release-formed-and-delivered-with-truthful-target-facts
    minimumConditions:
      - release baseline composed of referenced verified identities; coherence verified
      - all materialization deltas disposed (inheritance basis / SP-13 conclusions recorded)
      - per-target authorization exists with traceable basis and explicit applicability
      - attempt / rollout records complete with proceed / pause basis
      - no undisposed unknown outcome; non-idempotent retries have reconcile facts
      - runtime state matches reality and is timely; observation records handed to SP-17
      - findings classified and routed; candidate-defect class triggered re-evaluation
      - authority / generation control effective; no outdated action took effect
    doesNotMean: [target-validation-passed, target-release-complete,
                  accepted-current-release-updated, feature-exposed, recovery-complete,
                  change-closed, any-project-level-current-updated]

  returnPaths:
    - condition: identity gap in formation
      next: SP-14 identity / delta work; genuinely new artifact returns to SP-13
    - condition: authorization basis premise lapsed
      next: authorization lapses; A4 re-judgement; SP-13 / SP-05 as needed
    - condition: deployment step failure
      next: A11 classification — process defect -> fix EA-12; environment -> repair
            target, same release may redeploy
    - condition: outcome unknown
      next: confirm actual target state then reconcile; blind retry forbidden
    - condition: rollout slice fail
      next: proceed = STOP; finding routing; recovery via A12 -> SP-18
    - condition: candidate defect in target
      next: candidate disposition re-evaluation -> SP-13 / SP-06 / SP-05
    - condition: attribution failure
      next: isolate / decompose / pause one change / downgrade to NOT_READY
    - condition: stale / superseded action
      next: block, record, audit the authority mechanism

  exceptions:
    - id: E-no-rollout
      rule: low-risk / no-gradient-value deliveries deploy directly with a recorded
            necessity judgement; observation and SP-17 validation semantics unwaived
    - id: E-client-distribution
      rule: client / mobile / firmware uses distribution record / channel / cohort /
            adoption observation / version exposure / withdrawal records for the
            same semantics; fabricating a server environment record forbidden
    - id: E-feature-exposure-as-delivery
      rule: flag off->on / traffic 0->100% changes that materially alter user
            behavior go through this procedure's authority / observation / rollout
            controls; flag design and lifecycle stay with SP-16 (pending-definition,
            group 5) / SP-05
    - id: E-emergency
      rule: authorization wait and rollout pace compressible under Ch8 fast-path;
            basis traceability, authority token checks, no-blind-retry, finding
            classification and history retention never waived; compressed-path
            forward fixes reconcile afterwards via SP-21 (pending-definition,
            group 5) / SP-19

  evidenceByWork:
    natural:
      - CD platform / GitOps records, pipeline runs, observability systems
    extraOnlyFor: [authorization-basis-and-applicability-registry,
                   authority-token-confirmations, rollout-proceed-pause-basis,
                   finding-classification-records, anchor-verification-records,
                   unknown-outcome-reconcile-chains]
    rule: the carrier folds into existing platforms; semantic records never waived

  currentUpdateObligation:
    writesCurrent: environment-current-runtime-state-only
    note: >
      The environment current runtime state is an observed-fact current (P4 Ch9
      §33 baseline kind; §35 — runtime current is recorded at execution time,
      never deferred to change closure): this procedure commits it at execution
      time under authority backing, and SP-19 only verifies the commit fact
      without re-committing. It never equals the accepted current release
      (GI-05: accepted is not observed) — the accepted-current-release ledger
      transition happens at target release completion (SP-17); project-level
      currents (design / structure / calibration / change closure) go through
      SP-19. Neither merge nor deploy updates any project-level current.

  theoryTrace:
    part1: [GI-03, GI-05, GI-13, ch1-decision-record-authority-ledger]
    part2: [build-release-what-boundary, deploy-not-release-not-launch]
    part3: [runtime-deployment-where]
    part4: [ch7-forward-fix-97, ch7-materialization-delta-10-11,
            ch6-member-identity-binding-10-11-same-intent,
            ch7-ch6-interface-143, ch6-ch7-interface-142,
            ch7-formation-baseline-decision-target-8-22,
            ch7-authorization-basis-applicability-revalidation-entry-23-32,
            ch7-attempt-step-unknown-reconciliation-retry-33-45,
            ch7-rollout-46-59, ch7-runtime-state-observation-60-65,
            ch7-exposure-client-distribution-boundary-86-88,
            ch7-recovery-entry-89-102,
            ch7-finding-ordering-generation-authority-attribution-103-121,
            ch7-minimum-requirements-139-140, ch8-emergency-144,
            ch9-calibration-145, ch9-runtime-current-33-35]

  executableAssets: [EA-12, EA-13, EA-15, EA-16]
  assetRule: >
    Tooling fits: executing deployments / rollouts, issuing and checking
    generation / authority tokens, collecting and decomposing signals, updating
    runtime state, retaining history. Tooling does not fit: release /
    authorization decision conclusions (automatable only at low risk), finding
    classification conclusions, recovery path choice, anchor reality judgement,
    "looks fine" proceed judgements.

  referenceProfiles:
    - id: generic-layer
      bindings:
        applies: all profiles share operation contract / theory trace / evidence / control semantics
    - id: delivery-shape
      bindings:
        rule: shape decides target form and record form (server environment records
              vs client distribution records) and whether rollout mechanisms exist
    - id: risk-overlay
      bindings:
        rule: overlay decides authorization automation degree, concurrency strictness,
              representativeness / observation requirements, recovery anchor depth;
              concrete mappings registered in group-6

  example:
    ref: CHG-WO-142-RELEASE-1.9.0
    continues: SP-14 example (C2 built, identity sha256:9f2c…), leads into SP-17 / SP-18
    highlight: >
      Release WO-1.9.0 forms by referencing the verified C2 identities plus
      deployment definition DD8 — nothing rebuilt. Production-US authorization
      basis includes a verified recovery anchor (v1.8 artifact retained).
      Attempt D1 runs canary slice S1 at 5%: runtime state honestly recorded as
      mixed 1.8/1.9 while accepted current release stays 1.8. A material
      new-version transfer error is classified as candidate-defect-in-target
      (never "deployment failed"), triggering C2 disposition re-evaluation and
      the fix chain to C3. Recovery decision verifies v1.8 still reads the
      expanded schema, so R1 is traffic revert + artifact rollback with the
      expand retained and backfill paused — no destructive rollback. Counter-
      examples: node-quota exhaustion is a target-environment finding that never
      rejects C2; a timed-out V203 migration executor forbids direct retry until
      the actual state is reconciled; a delayed D1 completing after D2 cannot
      silently revert production under target deployment generation; US accepted
      at 1.9 while EU stays at 1.8 is legal per-scope reality.
