# SP-04 Impact / Scope Analysis — Operation Contract
# Machine-loadable mirror of 第五篇-SP04-ImpactScopeAnalysis-正式操作规程.md
# The Markdown body is the normative source; this contract is its structured projection
# for harness execution (park-smart-harness). Semantics must not diverge: if they do,
# repair the projection, never the reverse (GI-13).
apiVersion: spec.part5/v1alpha1
kind: OperationContract
metadata:
  id: SP-04
  name: Impact / Scope Analysis
  status: sealed                   # 2026-08-30 group-2 audit PASS AFTER REPAIR + regression 20/20 VERIFIED
  version: 1.0.0
  normativeSource: 第五篇-SP04-ImpactScopeAnalysis-正式操作规程.md
  singleResponsibility: >
    Understand a Change against truthful Current: identify material effects on
    engineering facts, dependencies, consumers, verification, delivery and runtime,
    and convert findings into an Engineering Obligation Profile. Not code search,
    not full-graph traversal, no design decisions, no final file list.

spec:

  triggers:
    - id: T-impact-entry-satisfied          # normal entry from SP-03 A9
    - id: T-reimpact-material-context-change
    - id: T-reimpact-new-consumer-or-version
    - id: T-reimpact-requirement-meaning-change
    - id: T-reimpact-implementation-deviation
    - id: T-reimpact-candidate-evidence
  reimpactRule: partial re-evaluation only; new versions never overwrite old ones
                # non-overwrite: P4 Ch3 §170; partiality: §123 / §244

  inputs:
    required:
      - name: change_record
        type: ref                              # SP-03 output
      - name: starting_baseline_context
        type: reference-set
        rule: resolvable to revision granularity
      - name: initial_scope_hypothesis
        type: scope-hypothesis
        rule: routing anchor; must not limit traversal
      - name: current_context
        type: CurrentContext                   # SP-01 output
    optional: []

  outputs:
    primary:
      kind: ImpactAssessmentRecord             # change-local navigation, NOT current authority
      fields:
        - name: impact_claims
          type: list<impact-claim>
          claimMinimum: [concern, target, impact-type, basis, baseline-ref]
          rule: old claims never deleted; re-evaluation creates new versions
        - name: trace_paths_with_stop_reasons
          rule: every stop explainable and evidence-backed
        - name: impact_frontier
        - name: scope_expansion_events
        - name: confirmed_affected_scope
          rule: concern-aware; not a final file list
        - name: impact_concern_matrix
          rule: navigation aid, not a mandatory checklist
        - name: unknown_classification
          vocabulary: [impact-blocking, design-resolvable, verification-resolvable, external-decision]
        - name: risk_driver_set
          rule: concrete drivers, not a risk score; includes risk-of-no-change
        - name: engineering_obligation_profile
          dimensions: [design-depth, architecture-review, verification, contract-compatibility,
                       data-migration-backfill, security, performance-capacity, delivery-rollout,
                       recovery-rollforward, observability, cross-owner-coordination]
          rule: may be short; not an approval form; recalibration keeps old versions
        - name: change_disposition_basis
    nonOutputs:
      - technical-solution-or-selection        # SP-05
      - final-file-list
      - requirement-acceptance                 # authority decision
      - implementation-plan

  invariants:
    - id: impact-five-keywords
      values: [baseline-scoped, traceable, material, explainable, risk-aware]
    - id: impact-before-design               # frozen by Part II
    - id: no-fixed-hop-count                 # stop reasons decide depth, not hops
    - id: tool-confidence-not-engineering-confidence

  actions:
    - id: A1
      name: Confirm analysis starting point (SP-03 outputs complete, baseline resolvable)
      controlMode: automation
      note: health-affected baseline must be known to the analysis
      rule: re-check gate-zeroing classifications from SP-03 (e.g. managed-unknown) for
            resolvable rationale/evidence; challenge disguised classifications back to SP-03
    - id: A2
      name: Select impact seeds
      controlMode: engineering-decision
      seedKinds: [proposed-requirement, module, logical-data, contract-event, runtime-unit, infrastructure]
    - id: A3
      name: Generate impact claims
      controlMode: engineering-decision   # tooling may draft; judgment stays human
      impactTypes:
        direct: semantic change at the object itself
        indirect: propagated via dependency (e.g. consumer compatibility); not low-risk by default
        potential: semantics undecided; must carry a next step (who, when)
        no-impact: per-concern claim with basis; "didn't see / grep empty" does not count
    - id: A4
      name: Execute trace propagation per concern
      controlMode: automation-assisted
      traces: [contract-reverse-to-consumers, data-forward-reverse, source-build,
               runtime-decomposed-by-concern, constraint-policy]
      traceRules:
        - constraint-policy may shape later obligations but is not a current direct relationship
      blindSpotRule: search/cache projections must not be data-impact blind spots
      rule: propagation judgment is semantic reasoning, not graph hops; derived traces are not authority
    - id: A5
      name: Judge stop reasons; form impact frontier
      controlMode: engineering-decision
      legalStops: [stable-contract-boundary, data-meaning-unchanged, change-semantics-do-not-propagate,
                   baseline-scope-not-applicable]
      illegalStops: [not-in-initial-scope, another-team-owns-it, grep-found-nothing, no-code-change-planned]
    - id: A6
      name: Handle scope expansion
      controlMode: engineering-decision
      rules:
        - expansion is a normal outcome, not change drift
        - supplementary baseline refs update working baseline with a reason; starting baseline history untouched
        - split considered only on scale/risk/owner divergence; never automatic
    - id: A7
      name: Form confirmed affected scope + concern matrix
      controlMode: engineering-decision
      rule: verification impact and release impact must surface at impact stage   # P4 Ch3 §108-109
    - id: A8
      name: Classify impact unknowns
      controlMode: engineering-decision
      rule: classifications that zero a hard gate (incl. no-impact basis) must carry
            resolvable rationale / evidence pointers; guardrail verifies presence and
            resolvability, never the judgement itself
    - id: A9
      name: Form risk driver set
      controlMode: engineering-decision
      drivers: [public-contract-external-consumer, data-authority-ownership, migration-backfill,
                security-trust-boundary, runtime-failure-domain, concurrency-consistency,
                performance-capacity, reliability-availability, irreversibility,
                recovery-difficulty-blast-radius, cross-owner-cross-system,
                multiple-supported-versions-mixed-version-compatibility,
                external-platform-dependency, regulatory-audit, high-uncertainty-weak-evidence]
      # 15 engineering entries; P4 Ch3 defines §138/§139 and §141/§142 as separate
      # sections — merged here by disposition, identical semantic coverage
      dualRisk: risk-of-change AND risk-of-no-change   # hotfix is the classic dual-risk case
    - id: A10
      name: Produce engineering obligation profile
      controlMode: engineering-decision
      rule: D0/D1/D2 is one dimension, not a change risk level
    - id: A11
      name: Form change disposition basis
      controlMode: engineering-decision
      note: disposition itself (accept/clarify/split/supersede/reject) is authority's decision;
            accepted requirement changes execute via requirement authority
    - id: A12
      name: Judge impact sufficiency
      controlMode: guardrail + engineering-decision
      minimumConditions:                            # P4 Ch3 §119
        - baseline context explainable
        - confirmed affected scope formed
        - critical consumer/contract/data/runtime paths handled
        - material no-impact claims have basis
        - potential impacts have disposition
        - impact frontier / stop reasons explainable
        - impact-blocking unknowns = 0
        - risk driver set formed
        - engineering obligation profile formed
        - change disposition basis sufficient
      rules:
        - sufficient != exhaustive; sufficient != perfect
        - no global impact percentage without a stable explainable denominator
      handoff: SP-05

  gates:
    - id: G-SP04-01
      type: hard-gate
      rule: no-sufficiency-with-impact-blocking-unknowns
    - id: G-SP04-02
      type: hard-gate
      rule: no-impact-claims-require-per-concern-basis
    - id: G-SP04-03
      type: hard-gate
      rule: no-design-before-impact    # blocks SP-05 entry
    - id: G-SP04-04
      type: hard-gate
      rule: tool-confidence-not-engineering-confidence
    - id: G-SP04-05
      type: hard-gate
      rule: gate-zeroing-classification-requires-resolvable-rationale-evidence

  passExit:
    equals: impact-sufficiency-met AND obligation-profile-formed
    becomesProgressFact: true
    doesNotMean: [design-ready, all-unknowns-eliminated, affected-scope-is-final-file-list, change-accepted]
    invalidation: material context change requires re-evaluation of the fact   # P4 Ch3 §123

  returnPaths:
    - condition: impact-blocking unknown unresolvable
      next: [clarification to trigger/requirement source, or change BLOCKED with owner + recheck trigger]
    - condition: baseline ref failure / material current change
      next: working-baseline reconciliation with reason; re-evaluate affected claims; starting baseline untouched
    - condition: scope explosion
      next: evaluate split/supersede; do not force one change
    - condition: cross-owner coordination failure
      next: explicit external-decision unknown; never a silent propagation stop
    - condition: gate-relevant structure finding on critical path
      next: repair finding before judging sufficiency

  exceptions:
    - id: E-small-change
      rule: lightweight record allowed; claim semantics (type/basis/baseline-ref) not skippable
    - id: E-emergency-hotfix
      rule: compressed trace breadth allowed
      obligation: obligation profile still mandatory; risk-of-no-change explicit;
                  full impact record reconciled afterwards via SP-19
    - id: E-reimpact
      rule: partial re-evaluation; old claim versions preserved

  evidenceByWork:
    natural:
      - impact assessment record (navigable from change record)
      - trace snapshots as evidence (snapshot != authority)
      - baseline references on claims
      - stop-reason supporting evidence
      - scope expansion / re-evaluation version history
    extraOnlyFor: [disposition decision, rationale]

  currentUpdateObligation:
    writesCurrent: false
    mayTrigger: [requirement-current-update via requirement authority,
                 structure-health-finding disposition, repair change, SP-19]
                 # SP-19 sealed (group-3)

  theoryTrace:
    part1: [GI-02, GI-03, GI-05, GI-07]
    part2: [ch2-requirement, ch4-quality, ch5-architecture, ch7-contract, ch8-data]
    part3: [ch7-trace-mapping, ch8-structure-health-finding]
    part4: [ch1-baseline-context, ch3-full, ch3-minimum-requirements-checklist]

  executableAssets: [EA-01, EA-08, EA-17]

  referenceProfiles:
    - id: RP-ONLINE-API-PY-GH
      bindings:
        contract_trace: openapi diff + consumer list
        data_trace: alembic version chain + ORM model references
        runtime_trace: compose / deployment config references
    - id: RP-B-CLI
      bindings:
        consumer_trace: downstream dependency declarations of published artifact
        runtime_concern: absent
    - id: RP-C-SDK
      bindings:
        consumer_trace: downstream dependency declarations of published artifact
        runtime_concern: absent

  example:
    ref: CHG-WO-017
    continues: SP-03 example (transferReason)
    highlight: >
      Potential impact on the reconciliation job carries an explicit next step;
      the search projection is caught by data forward trace (blind-spot rule);
      scope expansion adds search module with a reasoned working-baseline update;
      sufficiency passes with impact-blocking unknowns = 0.
