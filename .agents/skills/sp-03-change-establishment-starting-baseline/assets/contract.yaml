# SP-03 Change Establishment / Starting Baseline — Operation Contract
# Machine-loadable mirror of 第五篇-SP03-ChangeEstablishmentBaselineBinding-正式操作规程.md
# The Markdown body is the normative source; this contract is its structured projection
# for harness execution (park-smart-harness). Semantics must not diverge: if they do,
# repair the projection, never the reverse (GI-13).
apiVersion: spec.part5/v1alpha1
kind: OperationContract
metadata:
  id: SP-03
  name: Change Establishment / Starting Baseline
  status: sealed                   # 2026-08-30 group-2 audit PASS AFTER REPAIR + regression 20/20 VERIFIED
  version: 1.0.0
  normativeSource: 第五篇-SP03-ChangeEstablishmentBaselineBinding-正式操作规程.md
  singleResponsibility: >
    Bring a valid Engineering Trigger under engineering control: establish stable
    Change identity + minimum record, bind a truthful Starting Baseline, so that
    Impact has an honest starting point. Never approves, never designs,
    never creates any Baseline Transition.

spec:

  triggers:
    - id: T-valid-trigger-crossed-boundary       # GI-01
    - id: T-first-change-after-governance-cutover   # JG-01 handoff
    - id: T-incident-emergency-fix               # compressed, see exceptions
    - id: T-maintenance-debt-deprecation-followup
    - id: T-spike-conclusion-entering-product-source
  timingRedLine: >
    Change Record must exist no later than the first substantive Engineering
    Impact / Feasibility / Controlled Modification. Retrofitting a Change Record
    after code/PR is prohibited (P4 Ch2 §18-19).

  inputs:
    required:
      - name: engineering_trigger_reference
        type: ref
      - name: current_context
        type: CurrentContext        # output of SP-01
        rule: must carry SP-01 passExit evidence (every truth_status explicitly tagged);
              G-SP01-01 is re-checked at binding time (A6)
      - name: task_intent
        type: string
        rule: intent-states-outcome-not-solution   # P4 Ch2 §37
    optional:
      - name: known_constraints
        type: list<string>
      - name: related_incident_or_release
        type: ref
      - name: urgency
        type: enum [normal, urgent, emergency]

  outputs:
    primary:
      - name: stable_change_id
        rule: not-display-title
      - name: minimum_establishment_record
        fields: [change_id, trigger_intent_ref, current_owner, record_state, execution_condition, established_at]
        note: small changes may fold the record into Issue/PR; semantics must remain discoverable (GI-03, P4 Ch1 §34)
      - name: initial_scope_hypothesis
        rule: routing-anchor-only; must-not-limit-impact-traversal   # P4 Ch2 §88
      - name: starting_baseline_context
        type: reference-set
        rule: each ref resolvable to revision granularity with baseline scope   # P4 Ch2 §68-74
      - name: open_question_disposition
        type: "list<{question, class: blocking|managed, owner, resolution-point}>"
      - name: impact_entry_verdict
        type: enum [pass, blocked-with-recheck-trigger, returned-with-path]
    nonOutputs:
      - approved-for-implementation
      - requirement-accepted
      - design-or-target-conclusion
      - affected-scope                 # belongs to SP-04 / P4 Ch3
      - baseline-transition            # establishment never creates one (P4 Ch2 §25)

  invariants:
    - id: GI-01
      rule: valid-trigger-only
    - id: GI-02
      rule: truthful-starting-context
    - id: GI-03
      rule: every-change-controlled   # smallness changes carrier, not semantics
    - id: P4-establishment-not-approval
    - id: P4-starting-baseline-immutable    # historical anchor, never overwritten (P4 Ch1 §38)

  actions:
    - id: A1
      name: Confirm trigger validity and control-boundary crossing
      controlMode: engineering-decision
    - id: A2
      name: Check duplicate / related / superseded changes
      controlMode: engineering-decision   # not title-similarity automation
    - id: A3
      name: Establish change identity + minimum establishment record
      controlMode: automation
    - id: A4
      name: Bind change owner
      controlMode: engineering-decision
      rule: owner-must-exist-at-establishment; team identity allowed; handoff preserves identity
    - id: A5
      name: Form initial scope hypothesis
      controlMode: engineering-decision
      rule: entry-point + anti-blind-scan + baseline-selection driver only
    - id: A6
      name: Execute baseline binding (selection driven by intent/scope, not full-set)
      controlMode: automation-assisted
      rules:
        - branch-name-is-not-an-audit-anchor    # P4 Ch2 §69
        - runtime-state-binds-via-observation-or-deployment-record
        - requirement/contract/data bind as authority refs, never copied content
    - id: A7
      name: Dispose findings carried from SP-01
      controlMode: engineering-decision
      rules:
        - authority-conflict: stop contested semantics; designated owner rules per concern+scope (GI-12)
        - known-stale-current: tag health-affected; schedule calibration via SP-19
        - irrelevant-finding: record linkage, does not auto-block
    - id: A8
      name: Classify open engineering questions
      controlMode: engineering-decision
      vocabulary: [blocking-question, managed-unknown]
      rules:
        - insufficient info defaults to BLOCKED, never auto-REJECT   # P4 Ch2 §105
        - classifications that zero a hard gate (e.g. managed-unknown) must carry
          resolvable rationale / evidence pointers; downstream (SP-04 A1) may challenge
          disguised classifications back to this procedure
    - id: A9
      name: Judge Impact Entry Condition
      controlMode: guardrail + engineering-decision   # conditions auto-verified; "enough" judged
      minimumConditions:                              # P4 Ch2 §111
        - stable change id exists
        - change record exists
        - trigger/intent resolvable enough
        - current change owner exists
        - starting baseline context sufficiently bound
        - initial scope / routing anchor exists
        - blocking questions resolved enough for meaningful impact
        - material constraints / urgency visible when applicable
      handoff: SP-04

  gates:
    - id: G-SP03-01
      type: hard-gate
      rule: no-substantive-impact-without-change-record
    - id: G-SP03-02
      type: hard-gate
      rule: baseline-ref-must-resolve-to-revision-with-scope
    - id: G-SP03-03
      type: hard-gate
      rule: no-impact-with-unresolved-blocking-question
    - id: G-SP03-05
      type: hard-gate
      rule: gate-zeroing-classification-requires-resolvable-rationale-evidence
    - id: G-SP03-06
      type: hard-gate
      rule: no-baseline-binding-on-current-context-without-SP01-pass-evidence
    - id: G-SP03-04
      type: note
      rule: establishment-itself-is-not-a-gate   # must not be implemented as approval checkpoint

  passExit:
    equals: impact-entry-condition-satisfied
    doesNotMean: [requirement-accepted, design-ready, implementation-authorized, affected-scope-confirmed]

  returnPaths:
    - condition: trigger invalid / boundary not crossed
      next: return to trigger source, or downgrade to spike / investigation
    - condition: duplicate or should-supersede
      next: merge / link / supersession fence; do not create new identity
    - condition: baseline binding failure (dangling ref / unclear scope / unresolved authority)
      next: SP-01 §10 finding paths; no Impact until repaired
    - condition: blocking question unresolved
      next: record state OPEN + execution condition BLOCKED + owner + recheck trigger
    - condition: owner cannot be designated
      next: escalate to project governance (same bar as SP-02 R0 owner-resolvable)

  exceptions:
    - id: E-emergency
      rule: compressed establishment allowed (minimal record + minimal binding)
      obligation: fields completed and reconciled afterwards; never permanently missing   # P4 Ch2 §81
      followUp: [SP-19, SP-21]   # SP-19 sealed (group-3) — the interim domain-authority
                                 # change path is formally succeeded by SP-19;
                                 # SP-21 pending-definition (group-5)
    - id: E-queued-change
      rule: late binding — A1-A5 at establishment, A6-A9 deferred until substantive Impact starts
    - id: E-small-change
      rule: Issue/PR may carry all semantics; identity/owner/baseline anchor still mandatory
    - id: E-greenfield-first-change
      rule: starting baseline may truthfully read absent/none
      precondition: SP-02 R0 passed + governance cutover effective   # JG-01 step 8
      note: SP-02 OperationContract pending-definition; SP-02 MD is the normative source

  evidenceByWork:
    natural:
      - change record itself (Issue / PR / dedicated record)
      - pinned baseline references inside the record
      - owner binding / handoff record
      - open question classification + disposition
    extraOnlyFor: [blocking-question clarification decision, rationale]
    historyRule: starting baseline preserved, never overwritten

  currentUpdateObligation:
    writesCurrent: false
    mayTrigger: [stale-current repair change, SP-19 calibration]   # triggered, not executed here; SP-19 sealed (group-3)

  theoryTrace:
    part1: [GI-01, GI-02, GI-03, tailoring-9.2, tailoring-9.3]
    part2: [requirement, project-engineering]
    part3: [ch1, ch2, ch8-current-reference-semantics]
    part4:
      - ch1-change-identity-record-owner
      - ch1-starting-working-baseline-context
      - ch1-record-state-execution-condition
      - ch2-full   # establishment event, minimum record, owner binding, baseline binding,
                   # initial scope hypothesis, open questions, impact entry condition

  executableAssets: [EA-01, EA-05, EA-17]

  referenceProfiles:
    - id: RP-ONLINE-API-PY-GH
      bindings:
        change_record: GitHub Issue (or PR for small change)
        source_baseline: git SHA
        data_baseline: alembic revision
        runtime_binding: deployment record
    - id: RP-B-CLI
      bindings:
        release_baseline: published artifact version + channel
        runtime_binding: absent
    - id: RP-C-SDK
      bindings:
        release_baseline: published artifact version + channel
        runtime_binding: absent

  example:
    ref: CHG-WO-017
    continues: SP-01 example (transferReason)
    highlight: >
      Intent states the outcome ("转移工单时可记录并查询转移原因"), not the solution
      ("加 transferReason 字段"); consumer-list unknown is classified Blocking because
      entering the public event contract would fork the impact direction (P4 Ch2 §114).
