# SP-07 Contract Evolution — Operation Contract
# Machine-loadable mirror of 第五篇-SP07-ContractEvolution-正式操作规程.md
# The Markdown body is the normative source; this contract is its structured projection
# for harness execution (harness-agnostic). Semantics must not diverge: if they do,
# repair the projection, never the reverse (GI-13).
apiVersion: spec.part5/v1alpha1
kind: OperationContract
metadata:
  id: SP-07
  name: Contract Evolution
  status: sealed                   # 2026-09-01 group-4 audit PASS AFTER REPAIR + regression 1712 citations PASS AFTER REPAIR (REPAIR-1 applied)
  version: 1.0.0
  normativeSource: 第五篇-SP07-ContractEvolution-正式操作规程.md
  singleResponsibility: >
    Run the professional evolution of a change that touches cross-boundary
    contracts: establish contract current facts (Current Baseline / Stability /
    Lifecycle / consumer picture), judge compatibility and breaking change across
    four views (Source / Wire / Semantic / Operational), choose the evolution
    strategy (backward-compatible evolution / Parallel Change / new major), and
    organize deprecation / removal governance. Contract != Interface != Schema;
    structural compatibility != contract compatibility; version is a tool, not a
    compatibility strategy itself.

spec:

  triggers:
    - id: T-change-touches-cross-boundary-contract   # via SP-04 contract impact (JG-03)
    - id: T-contract-add-evolve-retire               # incl. config / authorization-policy
                                                     # semantics that have become cross-boundary
                                                     # commitments (P2 Ch7 §14-16)
    - id: T-de-facto-dependency-governance           # promote / migration window / stop support (§37)
    - id: T-removal-condition-due                    # deprecated contract removal evaluation (§55, §73.5)
  redLine: >
    A Stable contract must never break silently (§73.2 [MUST][BASELINE]): a breaking
    change must be explicitly recognized, impacted, strategized, verified, and
    released under control — never shipped as an ordinary internal refactor.

  inputs:
    required:
      - name: contract_impact_conclusion
        type: ref                     # SP-04: which contracts / boundary kinds / depth
      - name: current_contract_baseline
        type: reference-set           # effective commitment + artifact refs (§67-69)
      - name: stability_lifecycle_state
        type: reference-set           # Stability Level x Lifecycle Status (§28-31)
      - name: consumer_picture
        type: reference-set           # consumer type / known critical consumer /
                                      # external-internal / upgrade control (§19, §43-44)
    conditional:
      - name: de_facto_dependency_leads
        type: list<evidence-ref>
        appliesWhen: undocumented-but-long-depended-on behavior discovered (§37)

  outputs:
    primary:
      - name: contract_evolution_record
        fields: [contract-identity, type, stability-x-lifecycle,
                 compatibility-judgment, judgment-basis, evolution-strategy,
                 verification-strategy, owner]
        rule: bound to Current Baseline revision
      - name: compatibility_matrix
        rule: required combinations + verification status; N/A combos explicit and
              consistent with deployment / rollback strategy (§74)
      - name: parallel_change_phase_plan
        rule: Expand / Migrate / Contract phases + cleanup condition + owner per
              compatibility layer (§48-51)
      - name: deprecation_record
        fields: [deprecated-what, replacement, reason, migration-guide,
                 consumer-usage, deprecation-start, removal-condition-policy, owner]  # §53
      - name: contract_debt_registration
        fields: [debt-item, risk, owner, cleanup-condition]   # §78
    nonOutputs:
      - implementation-output                     # SP-06
      - verification-verdicts                     # SP-11 / SP-12 / SP-13
      - release-delivery-facts                    # SP-15 / SP-17
      - current-contract-updates                  # SP-19 (§68)
      - data-migration-backfill-execution         # SP-08

  invariants:
    - id: contract-not-interface-not-schema
    - id: structural-compat-not-contract-compat
    - id: stability-axis-not-lifecycle-axis
    - id: machine-diff-is-signal-not-verdict
    - id: version-string-not-compat-evidence
    - id: consumer-invisibility-breeds-conservatism
    - id: proposed-never-precovers-current
    - id: deprecation-not-a-todo

  actions:
    - id: A1
      name: Confirm entry and contract touch surface
      controlMode: automation-assisted
      rules:
        - enumerate all cross-boundary contracts touched; classify by six types (§8);
          governance strength by consumer independence (§7)
        - "B1 re-challenge: upstream no-contract-impact / internal-only classifications
          without resolvable rationale return to SP-04"
    - id: A2
      name: Establish contract current facts
      controlMode: engineering-decision
      rules:
        - resolve Current Contract Baseline per contract (§67-69), Stability x
          Lifecycle (§28), provider / consumer (§19)
        - "build consumer picture (§43-44): who / which versions / external? /
          force-upgradable? / long-offline clients? / persisted old messages?"
        - the less visible the consumer, the more conservative the provider
        - register de-facto dependencies; disposition = promote / migration window /
          explicit stop-support (§37)
    - id: A3
      name: Contract diff and compatibility judgment
      controlMode: engineering-decision   # machine diff is input only
      rules:
        - "produce before/after comparison (§66): OpenAPI diff / proto checker /
          schema-registry compatibility / git diff / manual semantic review"
        - judge across four views (§32-36) against the §38-42 breaking list
        - "judgment carries basis (B1): \"compatible\" explains each view; \"breaking\"
          names the commitment facet touched"
        - judgment is re-challengeable by SP-05 / SP-13 / group audit
    - id: A4
      name: Choose evolution strategy
      controlMode: engineering-decision
      rules:
        - "priority (§45): backward-compatible evolution -> Parallel Change /
          migration -> new major / new contract only when necessary"
        - "non-atomic upgrade must first define supported version combinations
          (§73.4 [MUST][BASELINE]): old-consumer+new-provider always; new-consumer+
          old-provider when rolling/independent deploy; rollback combos (§75);
          stored old message/data (§76)"
        - express combinations + verification status in a Compatibility Matrix (§74);
          N/A combos must be real and consistent with deployment / rollback
          strategy — N/A is a gate-zeroing judgment and carries rationale (B1)
    - id: A5
      name: Parallel Change phase control (when applicable)
      controlMode: engineering-decision + guardrail   # removal condition mechanically verified
      rules:
        - define Expand / Migrate / Contract phases (§48-52); applies to any
          non-atomic provider/consumer scenario, not only HTTP APIs
        - every compatibility layer gets cleanup condition + owner (§51)
        - migrate-phase state (who migrated / who not) truthfully maintained;
          no permanent dual-stack
    - id: A6
      name: Deprecation / removal governance (when applicable)
      controlMode: guardrail + engineering-decision
      rules:
        - deprecation record: 8 fields (§53)
        - removal condition over arbitrary dates (§55); stability level shapes the
          deprecation promise (§56)
        - a label without migration target / state / exit condition is a comment,
          not deprecation (§54)
    - id: A7
      name: Contract artifact and verification strategy
      controlMode: engineering-decision
      rules:
        - authoritative discoverable current contract source (§57); machine-readable
          artifact preferred for multi-consumer long-lived HTTP APIs (§58-59);
          events use AsyncAPI / schema + event semantics (§60); proto discipline
          (§61)
        - "verification strategy covers applicable facets of §65: shape / semantic
          rule / error / default / compatibility / authorization /
          ordering-delivery / idempotency"
        - contract test / CDC introduced per fit conditions (§63-64); execution
          hands off to SP-11 / SP-12 / SP-13 — this procedure only defines which
          commitment facets must be verified
    - id: A8
      name: Review organization and owner confirmation
      controlMode: engineering-decision
      rules:
        - "contract owner duties (§70): provider owner vs consumer owner; external
          consumers managed via documentation / support / telemetry / communication"
        - review covers risk boundaries by type (§71); checklist by applicability
          (§72) with N-A items carrying rationale (B1); review execution = SP-12
    - id: A9
      name: Handoff and downstream boundaries
      controlMode: engineering-decision
      rules:
        - material design layer -> SP-05 (evolution strategy and compatibility
          conclusions as design input; Parallel Change phase plan feeds transition
          design)
        - implementation (incl. contract-artifact sync hard rule) -> SP-06
        - verification execution and candidate conclusion -> SP-11 / SP-12 / SP-13
        - delivery and target validation -> SP-15 / SP-17
        - emergency breaking change (§77 four cases) -> Ch8 + SP-21
          pending-definition〔历史标注：所指接口均已 SEALED 落地，见 第五篇-CurrentBaseline总索引 §2〕 (group-5) for compressed execution and reconciliation;
          the 8 minimum records and this procedure's compatibility analysis are
          never exempted
    - id: A10
      name: Contract debt and health registration
      controlMode: guardrail
      rules:
        - register compatibility layers / permanent dual versions / never-removed
          deprecations / cross-boundary DB reads / duplicate events / temp adapters /
          compatibility flags with risk + owner + cleanup condition (§78)
        - long-lived projects may observe health signals (§79); never forced KPI

  gates:
    - id: G-SP07-01
      type: hard-gate
      rule: no-silent-breaking-of-stable-contract   # §73.2 [MUST][BASELINE]
    - id: G-SP07-02
      type: hard-gate
      rule: non-atomic-upgrade-requires-defined-verified-version-combinations
      note: N/A combos must be real and consistent with rollback strategy   # §73.4, §74-76
    - id: G-SP07-03
      type: hard-gate
      rule: deprecated-contract-requires-replacement-migration-owner-removal-condition   # §73.5, §54
    - id: G-SP07-04
      type: hard-gate
      rule: stable-boundary-requires-explicit-contract
      note: capability / input-output-message / meaning / failure /
            compatibility expectation / owner   # §73.1
    - id: G-SP07-05
      type: hard-gate
      rule: machine-diff-or-schema-compat-never-final-breaking-verdict   # §65-66, §35-36
    - id: G-SP07-06
      type: hard-gate
      rule: no-blind-change-of-key-contract-without-consumer-knowledge   # §43-44
    - id: G-SP07-07
      type: hard-gate
      rule: no-compatibility-layer-without-cleanup-condition-and-owner   # §51, §78
    - id: G-SP07-08
      type: hard-gate
      rule: proposed-contract-never-precovers-current   # §68, GI-05; current via SP-19
    - id: G-SP07-09
      type: hard-gate
      rule: unchanged-version-string-never-claims-no-breaking   # §47
    - id: G-SP07-10
      type: hard-gate
      rule: gate-zeroing-judgment-requires-resolvable-rationale
      note: covers compatible judgments / N-A combos / de-facto downgrades /
            internal-only classifications; re-challengeable by SP-05 / SP-13 /
            group audit   # B1 systemic rule, §74

  passExit:
    equals: >
      Contract Evolution Plan established (bound to contract identity + current
      baseline revision): four-view compatibility judgment with basis per touched
      contract + explicit evolution strategy (backward-compatible / Parallel
      Change phase plan / new major) + verification strategy covering applicable
      commitment facets (§65) + when applicable: matrix combinations with
      verification status, deprecation record, compatibility-layer cleanup
      obligations -> handoff to SP-05 (when material) / SP-06
    doesNotMean: [verification-passed, contract-released, consumers-migrated,
                  current-contract-updated]

  returnPaths:
    - condition: consumer picture unknowable and change is key
      next: build consumer information first (§43-44 lightweight means);
            otherwise only conservative strategy; blind change forbidden (G-SP07-06)
    - condition: verification strategy coverage insufficient
      next: back to A7 to add commitment facets
    - condition: material design problem (transition / target change)
      next: SP-05
    - condition: de-facto dependency dispute
      next: explicit three-way disposition (§37); never shelved
    - condition: rollback / stored-message combination unsupportable
      next: back to A4 to redefine combinations or adjust release strategy (§75-76)
    - condition: emergency breaking
      next: Ch8 + SP-21 pending-definition〔历史标注：所指接口均已 SEALED 落地，见 第五篇-CurrentBaseline总索引 §2〕 (group-5) compressed path; §77 eight
            records and this procedure's compatibility analysis never exempted

  exceptions:
    - id: E-atomic-internal
      rule: "same team / same repo / truly atomic upgrade -> lightweight form (§80.1):
            Public Interface + Semantic Rule + Module Test; breaking still impacted,
            but a long-term version may not be required (§80.1); deprecation
            promise judged explicitly per §56 (stability level shapes it) and the
            actual consumers; \"atomic\" must be real, else strengthen per §80.2/§80.3"
    - id: E-experimental-preview
      rule: "may explicitly not guarantee long-term compatibility (§29, §56), but
            four minimums non-negotiable: not-stable marker / consumer scope /
            change expectation / owner"
    - id: E-emergency-breaking
      rule: §77 four cases may compress deprecation window; 8 minimum records never
            exempted; compressed execution and post-hoc reconciliation = Ch8 +
            SP-21 pending-definition〔历史标注：所指接口均已 SEALED 落地，见 第五篇-CurrentBaseline总索引 §2〕 (group-5); compatibility and consumer impact
            analysis stays here
    - id: E-one-off-internal
      rule: coordinatable atomic upgrade allowed without Parallel Change (§48);
            the "one-off / coordinatable" judgment carries rationale (B1)

  evidenceByWork:
    natural:
      - contract evolution record (judgment + strategy + basis)
      - contract diff (machine + manual semantic comparison)
      - compatibility matrix (when applicable)
      - deprecation record / removal evaluation (when applicable)
      - review record (SP-12, revision-bound)
    extraOnlyFor: [breaking-judgment-rationale, na-combination-rationale,
                   de-facto-disposition-decision, emergency-eight-records]
    rule: all other evidence emerges naturally from the work

  currentUpdateObligation:
    writesCurrent: false
    boundaries:
      - current contract must describe the effective commitment (§67); proposed
        contract never pre-covers current before becoming effective software
        state (§68)
      - current contract migration goes explicitly through SP-19 after
        implementation + verification + release / baseline transition
      - during multi-version coexistence, supported contracts' stability /
        lifecycle and consumer migration state are truthfully maintained (§69) —
        baseline fact maintenance, not current rewrite

  theoryTrace:
    part1: [GI-03, GI-05]
    part2: [p2-ch7-contract-full-chapter,   # WHAT authority
            p2-ch6-module-public-capability-prerequisite]
    part2Note: >
      P2 Ch7 §77 / §86 cite the old SP lineage (SP-22 emergency, SP-25~27
      calibration); mapped under the SP-22 cap to SP-21 (group-5 pending) and
      SP-19 respectively.
    part3: [contract-consumer-mapping]       # Ch7 cross-dimension contract relations
    part4: [ch3-contract-impact-deepening, ch4-transition-design-handoff,
            ch5-contract-artifact-sync-rule, ch8-emergency-breaking-path]
    journey: [JG-03]

  executableAssets: [EA-09, EA-08, EA-17]
  assetRule: >
    tooling fits: machine diff, schema compatibility checks, matrix existence
    verification, deprecation field completeness checks. Tooling does not fit:
    semantic / operational compatibility judgment, evolution strategy selection,
    de-facto disposition decisions. A filled template is never judgment evidence
    (GI-06).

  referenceProfiles:
    - id: RP-ONLINE-API-PY-GH
      bindings:
        http_contract_artifact: OpenAPI (CI diff check)
        internal_event: schema + semantic documentation
        consumer_picture: service dependency map + repository search
        verification: module test + optional CDC
    - id: RP-B-CLI   # pending-definition〔历史标注：所指接口均已 SEALED 落地，见 第五篇-CurrentBaseline总索引 §2〕 (group-6)
      bindings:
        contract_surface: commands / parameters / output format (incl. JSON output stability)
        versioning: SemVer on package version
        consumer: downstream scripts / CI integrations; no long-lived online consumer
    - id: RP-C-SDK   # pending-definition〔历史标注：所指接口均已 SEALED 落地，见 第五篇-CurrentBaseline总索引 §2〕 (group-6)
      bindings:
        contract_surface: public API surface; strict SemVer; strongest compatibility window
        deprecation: precedes removal (at least one minor marked)
        consumer: uncontrollable -> most conservative judgment

  example:
    ref: CHG-WO-142
    continues: P2 Ch7 §81-84 work-order transfer API + transfer-reason example;
               front segment of this group's example chain (how contract C9 evolves
               from v1 into the reason capability)
    highlight: >
      POST /v1/work-orders/{id}:transfer (Stable/Active, external partner as known
      critical consumer) needs a reason field: direct required = classic breaking
      (§40); optional-with-unchanged-default judged compatible across all four
      views with recorded basis. WorkOrderTransferred gains a reason field judged
      compatible per the §84 four checks. A de-facto dependency (Admin App relying
      on the undocumented "event within 5s of transfer" timing) is registered and
      promoted into the event contract's timing semantics (§37). Strategy:
      backward-compatible evolution now; the end-state "reason required" is
      registered as a future new-major / staged-enforcement item, never advanced
      silently (§83).
